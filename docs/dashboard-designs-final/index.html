<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi · home — Project Rollups</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b0f14; --panel:#111821; --panel-2:#17212d; --border:#263342;
  --text:#e7edf5; --muted:#93a4b8; --accent:#7dd3fc; --danger:#fb7185;
  /* state palette — rationed strictly to STATUS (never decoration / source / lineage) */
  --st-run:#7dd3fc;   /* running / looping  */
  --st-block:#facc15; /* blocked · needs input */
  --st-fail:#fb7185;  /* failed */
  --st-sign:#c084fc;  /* done · awaiting sign-off */
  --st-merge:#4ade80; /* completed · merged */
  --st-idle:#7e93aa;  /* queued / planned / dormant */
  --seg-off:rgba(125,146,170,.26); /* unmet criterion segment */
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background: radial-gradient(circle at 50% -8%, #142032 0, var(--bg) 46rem);
  color:var(--text);
  /* type scale: 11 / 12 / 13 / 15 / 20 / 30 · weights 450 / 650 / 800 */
  font:13px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight:450;
  -webkit-font-smoothing:antialiased;
  overflow-y:auto;
}
button{font:inherit;cursor:pointer;color:inherit;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

/* ───────────── shell ───────────── */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  height:46px;padding:0 26px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb,var(--border) 70%, transparent);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:15px;}
.brand .dot{width:9px;height:9px;border-radius:999px;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.brand .sub{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.14em;}
.topbar .spacer{flex:1;}
.tbtn{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);}
.tbtn:hover{color:var(--accent);background:var(--panel-2);}
.tbtn svg{width:16px;height:16px;}
/* scenario switcher (mockup-only control) */
.scn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:650;}
.scn .lab{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:color-mix(in srgb,var(--muted) 70%,transparent);}
.scn select{appearance:none;border:0;background:transparent;color:var(--text);font:inherit;font-weight:650;font-size:12px;padding:0 4px;outline:none;cursor:pointer;}
.scn svg{width:13px;height:13px;color:var(--muted);}

.wrap{max-width:1200px;margin:0 auto;padding:30px 26px 90px;}

/* ───────────── hero ───────────── */
.hero{margin:8px 0 18px;}
.eyebrow{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px;}
.headline{font-size:30px;line-height:1.18;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;max-width:780px;}
.headline em{font-style:normal;color:var(--st-block);}
.headline em.calm{color:var(--st-run);}
.subline{color:var(--muted);font-size:13px;max-width:760px;}
.subline b{color:var(--text);font-weight:650;}
/* since-last-visit delta (#1,#11) — demoted from a bordered band to one muted clause on the subline */
.subline .delta{color:color-mix(in srgb,var(--muted) 90%,transparent);}
.subline .delta::before{content:"·";margin:0 7px;color:color-mix(in srgb,var(--muted) 50%,transparent);}
.subline .delta b{color:var(--text);font-weight:650;}
.subline .delta .sep{color:color-mix(in srgb,var(--muted) 50%,transparent);margin:0 2px;}
.subline .delta .net{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;}
.subline .delta .net .a{color:color-mix(in srgb,var(--st-merge) 85%,var(--muted));} .subline .delta .net .d{color:color-mix(in srgb,var(--st-fail) 80%,var(--muted));}
/* tally rail — fleet summary that doubles as jump-links (Calm Console graft) */
.rail{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  height:28px;padding:0 11px;border:1px solid var(--border);border-radius:999px;
  background:color-mix(in srgb,var(--panel) 70%, transparent);
  color:var(--muted);font-size:12px;font-weight:650;transition:border-color .14s ease,color .14s ease;
}
.pill[data-jump]{cursor:pointer;}
.pill[data-jump]:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--text);}
.pill .n{color:var(--text);font-weight:800;}
/* swatch is decorative ink (#10): rendered ONLY on the pills that carry hue (sign, warn) */
.pill .sw{width:8px;height:8px;border-radius:999px;background:var(--st-idle);}
/* hue rationed (#2): only the ACTIONABLE Sign-off pill + a stalled-loop warning pill carry colour */
.pill.sign{color:var(--st-sign);border-color:color-mix(in srgb,var(--st-sign) 34%,var(--border));}
.pill.sign .sw{background:var(--st-sign);}
.pill.sign .n{color:var(--st-sign);}
.pill.sign:hover{border-color:color-mix(in srgb,var(--st-sign) 60%,var(--border));}
.pill.warn{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 38%,var(--border));}
.pill.warn .sw{background:var(--st-block);}
.pill.warn .n{color:var(--st-block);}
.pill.warn:hover{border-color:color-mix(in srgb,var(--st-block) 60%,var(--border));}
/* delta digest fragments are jump-links (#7) */
.subline .delta a{color:color-mix(in srgb,var(--text) 90%,transparent);cursor:pointer;border-bottom:1px dotted color-mix(in srgb,var(--muted) 45%,transparent);}
.subline .delta a:hover{color:var(--accent);border-bottom-color:var(--accent);}
.subline .delta b{color:var(--text);font-weight:650;}

/* ───────────── section heads ───────────── */
.shead{display:flex;align-items:baseline;gap:10px;margin:32px 0 14px;scroll-margin-top:60px;}
/* jump targets clear the sticky topbar (#9,#10) */
.done,.grpcard,.pcard,.prow{scroll-margin-top:60px;}
.shead h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
.shead .cnt{font-size:12px;color:color-mix(in srgb,var(--muted) 75%,transparent);}
.shead .hint{margin-left:auto;font-size:12px;color:color-mix(in srgb,var(--muted) 65%,transparent);}
.shead .hbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--st-block) 40%,var(--border));background:color-mix(in srgb,var(--st-block) 9%,transparent);color:var(--st-block);font-size:12px;font-weight:650;}
.shead .hbtn:hover{background:color-mix(in srgb,var(--st-block) 16%,transparent);}
.shead .hbtn svg{width:13px;height:13px;}
/* purple batch action for the sign-off section header (#1) */
.shead .hbtn.sgn{border-color:color-mix(in srgb,var(--st-sign) 42%,var(--border));background:color-mix(in srgb,var(--st-sign) 10%,transparent);color:var(--st-sign);}
.shead .hbtn.sgn:hover{background:color-mix(in srgb,var(--st-sign) 18%,transparent);}

/* ───────────── needs you ───────────── */
.needs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.needs.single{grid-template-columns:minmax(360px,620px);}  /* one need → natural width, no empty sibling (#19) */
.need{
  position:relative;border:1px solid var(--border);border-radius:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel-2) 92%,transparent),var(--panel));
  padding:15px 16px 14px;display:flex;flex-direction:column;gap:11px;
  overflow:hidden;
}
.need::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;}
.need.block::before{background:var(--st-block);}
.need.fail::before{background:var(--st-fail);}
.need .crumb{font-size:11px;color:var(--muted);}
.need .crumb b{color:var(--text);font-weight:650;}
.need .sname{font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.need .ask{
  font-size:13px;color:var(--text);line-height:1.5;
  padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);
  background:color-mix(in srgb,var(--bg) 55%,transparent);
}
.need.block .ask{border-color:color-mix(in srgb,var(--st-block) 34%,var(--border));}
.need.fail  .ask{border-color:color-mix(in srgb,var(--st-fail) 34%,var(--border));color:#ffd9df;}
/* blast tag (#16) — hue FOLLOWS the item's own status so one card never shows two alarm colours.
   block item → amber, fail item → red; magnitude (high/elevated) lives in the LABEL, not a 3rd hue. */
.blast{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:650;
  letter-spacing:.02em;color:var(--muted);border:1px solid color-mix(in srgb,var(--border) 85%,transparent);}
.blast.block{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 38%,transparent);background:color-mix(in srgb,var(--st-block) 8%,transparent);}
.blast.fail{color:var(--st-fail);border-color:color-mix(in srgb,var(--st-fail) 40%,transparent);background:color-mix(in srgb,var(--st-fail) 9%,transparent);}
/* DoD source label (#8) — borderless passive metadata: a leading middot + plain muted text.
   Bordered pills are reserved for things you can click; a source label is not interactive. */
.srcTag{
  display:inline-flex;align-items:center;
  font-size:12px;font-weight:450;letter-spacing:0;color:var(--muted);background:transparent;white-space:nowrap;
}
.srcTag::before{content:"·";margin:0 5px 0 1px;color:color-mix(in srgb,var(--muted) 50%,transparent);}
.lbl{color:color-mix(in srgb,var(--muted) 80%,transparent);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:11px;}
/* quick-reply chips — prefill the composer so answering IS continuing (Calm Console graft) */
.qreply{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.qreply .qlbl{font-size:11px;color:color-mix(in srgb,var(--muted) 75%,transparent);margin-right:1px;font-weight:650;}
.qreply button{border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--text);background:var(--panel-2);font-weight:650;}
.qreply button:hover{border-color:var(--accent);color:var(--accent);}
.need .actions{display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap;}
.degraded{font-size:11px;color:color-mix(in srgb,var(--muted) 80%,transparent);font-style:italic;}

/* compact overflow need rows (the "+N more" stepper) */
.needmore{margin-top:4px;border:1px dashed color-mix(in srgb,var(--border) 90%,transparent);border-radius:12px;overflow:hidden;}
.needmore-h{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:650;}
.needmore-h:hover{background:color-mix(in srgb,var(--text) 3%,transparent);}
.needmore-h b{color:var(--text);font-weight:800;}
.needmore-h .chev{margin-left:auto;}
.needmore.open .needmore-h .chev{transform:rotate(90deg);}
.needmore-b{display:none;padding:2px 8px 8px;}
.needmore.open .needmore-b{display:block;}
.needrow{display:flex;align-items:center;gap:11px;padding:10px 8px;border-top:1px solid color-mix(in srgb,var(--border) 50%,transparent);}
.needrow:first-child{border-top:0;}
.needrow .nleft{flex:1;min-width:0;}
.needrow .ncrumb{font-size:11px;color:var(--muted);}
.needrow .ncrumb b{color:var(--text);font-weight:650;}
.needrow .nq{font-size:12px;color:color-mix(in srgb,var(--text) 88%,transparent);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* status badge */
.badge{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:650;border:1px solid transparent;white-space:nowrap;}
.badge .d{width:7px;height:7px;border-radius:999px;}
.badge.block{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 40%,transparent);background:color-mix(in srgb,var(--st-block) 11%,transparent);}
.badge.block .d{background:var(--st-block);}
.badge.fail{color:var(--st-fail);border-color:color-mix(in srgb,var(--st-fail) 42%,transparent);background:color-mix(in srgb,var(--st-fail) 11%,transparent);}
.badge.fail .d{background:var(--st-fail);}
.badge.run{color:var(--st-run);border-color:color-mix(in srgb,var(--st-run) 40%,transparent);background:color-mix(in srgb,var(--st-run) 10%,transparent);}
.badge.run .d{background:var(--st-run);}
.badge.sign{color:var(--st-sign);border-color:color-mix(in srgb,var(--st-sign) 42%,transparent);background:color-mix(in srgb,var(--st-sign) 11%,transparent);}
.badge.sign .d{background:var(--st-sign);}
.badge.merge{color:var(--st-merge);border-color:color-mix(in srgb,var(--st-merge) 42%,transparent);background:color-mix(in srgb,var(--st-merge) 11%,transparent);}
.badge.merge .d{background:var(--st-merge);}
.badge.idle{color:var(--st-idle);border-color:color-mix(in srgb,var(--st-idle) 38%,transparent);background:color-mix(in srgb,var(--st-idle) 9%,transparent);}
.badge.idle .d{background:var(--st-idle);}
.badge.unset{color:var(--st-sign);border-color:color-mix(in srgb,var(--st-sign) 38%,transparent);background:transparent;}
.badge.unset .d{background:transparent;box-shadow:inset 0 0 0 1.4px var(--st-sign);}
.badge.paused{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 32%,transparent);background:transparent;}
.badge.paused .d{background:transparent;box-shadow:inset 0 0 0 1.4px var(--st-block);}
.loopBadge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--st-run);
  border:1px solid color-mix(in srgb,var(--st-run) 38%,transparent);background:color-mix(in srgb,var(--st-run) 9%,transparent);}
.loopBadge .inf{font-size:13px;line-height:1;}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:12px;font-weight:650;}
.btn:hover{border-color:var(--accent);}
.btn svg{width:14px;height:14px;}
.btn.primary{background:#0f4c75;border-color:#256b97;color:#dff1ff;font-weight:800;}
.btn.primary:hover{border-color:var(--accent);background:#125b8c;}
.btn.ghost{background:transparent;color:var(--muted);}
.btn.ghost:hover{color:var(--text);border-color:color-mix(in srgb,var(--border) 90%,transparent);}
.btn.sm{height:29px;padding:0 10px;font-size:12px;}
.btn.pause{background:transparent;color:var(--muted);border-style:dashed;}
.btn.pause:hover{color:var(--st-run);border-color:color-mix(in srgb,var(--st-run) 40%,transparent);border-style:solid;}

/* dot-strip (Status Lanes graft) — colourblind-safe via SHAPE channel (#15) */
.dotstrip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;}
.dotstrip .d{position:relative;width:8px;height:8px;border-radius:999px;background:currentColor;color:var(--st-idle);}
.dotstrip .d.run,.dotstrip .d.loop{color:var(--st-run);border-radius:999px;}     /* solid circle */
.dotstrip .d.merge{color:var(--st-merge);border-radius:999px;}                    /* solid circle */
.dotstrip .d.block{color:var(--st-block);border-radius:1px;}                      /* square */
.dotstrip .d.sign{color:var(--st-sign);border-radius:1px;transform:rotate(45deg);} /* diamond */
.dotstrip .d.idle{background:transparent;box-shadow:inset 0 0 0 1.6px currentColor;color:var(--st-idle);} /* hollow ring */
.dotstrip .d.fail{color:var(--st-fail);background:transparent;}                   /* × glyph */
.dotstrip .d.fail::after{content:"\00d7";position:absolute;inset:-3px 0 0;font-size:12px;line-height:1;font-weight:800;text-align:center;color:var(--st-fail);}

/* ───────────── project grid ───────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start;}
.grid.single{grid-template-columns:minmax(360px,560px);justify-content:center;}
.pcard{
  border:1px solid var(--border);border-radius:16px;background:var(--panel);
  overflow:hidden;transition:border-color .15s ease;
}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border));}
.pcard.open{border-color:color-mix(in srgb,var(--accent) 36%,var(--border));}
.pcard-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;cursor:pointer;}
.pcard-id{flex:1;min-width:0;}
.pname{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:-.01em;flex-wrap:wrap;}
/* lineage badge neutral (#5) */
.nest{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:650;
  letter-spacing:0;color:var(--muted);border:1px solid color-mix(in srgb,var(--border) 92%,transparent);background:transparent;}
.ppath{font-size:12px;color:var(--muted);margin-top:3px;}
.pcard-counts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.chev{color:var(--muted);transition:transform .18s ease;display:inline-grid;place-items:center;width:20px;height:20px;}
.pcard.open .chev{transform:rotate(90deg);}
.countpill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:650;border:1px solid var(--border);background:transparent;color:var(--muted);}
.countpill.sgn{color:var(--st-sign);border-color:color-mix(in srgb,var(--st-sign) 38%,transparent);background:color-mix(in srgb,var(--st-sign) 9%,transparent);}
.countpill.run{color:var(--st-run);border-color:color-mix(in srgb,var(--st-run) 38%,transparent);background:color-mix(in srgb,var(--st-run) 9%,transparent);}
.countpill.calm{color:var(--muted);}
/* jump-link count pill — Needs-you owns the alarm, this just points there (#6) */
.countpill.jump{cursor:pointer;color:var(--muted);border-style:dashed;}
.countpill.jump:hover{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 40%,transparent);}

/* rings row (collapsed summary) */
.rings{display:flex;gap:12px;padding:4px 16px 14px;flex-wrap:wrap;align-items:flex-start;}
.ringcell{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;text-align:center;position:relative;}
.ring{width:54px;height:54px;display:block;}  /* bumped 46→54 so 4–6 segments stay crisp (#15) */
.ringcell .wsn{font-size:11px;line-height:1.2;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
/* surfaced (already in Needs-you): keep the ring SALIENT so attention doesn't invert onto the
   quietest cell (#11) — dashed amber outline + amber label + an ↑ marker that jumps up. */
.ringcell.surfaced .wsn{color:var(--st-block);font-weight:650;}
.ringcell.surfaced .ring{outline:1.5px dashed color-mix(in srgb,var(--st-block) 55%,transparent);outline-offset:2px;border-radius:999px;}
.upmark{position:absolute;top:-3px;right:2px;font-size:10px;font-weight:800;color:var(--st-block);background:var(--panel);
  border:1px solid color-mix(in srgb,var(--st-block) 45%,var(--border));border-radius:7px;padding:0 4px;line-height:15px;}
/* neutral 'evaluating' ring (#5) — phase-2 DoD stream / on-demand re-check: pulsing track, no number, no hue */
.ring-track.eval{animation:ringpulse 1.3s ease-in-out infinite;stroke:color-mix(in srgb,var(--accent) 55%,var(--border));}
@keyframes ringpulse{0%,100%{opacity:.3;}50%{opacity:.95;}}
@media (prefers-reduced-motion: reduce){ .ring-track.eval{animation:none;opacity:.6;} }
/* all workstreams surfaced → collapse the ghost-ring row to a single honest line (#13) */
.surfline{display:flex;align-items:center;gap:9px;padding:6px 16px 14px;color:var(--muted);font-size:12px;}
.surfline .sq{width:8px;height:8px;border-radius:2px;background:var(--st-block);flex-shrink:0;}
.surfline b{color:var(--text);font-weight:650;}
.surfline .jump{margin-left:auto;color:var(--muted);border:1px dashed var(--border);border-radius:999px;padding:3px 10px;background:transparent;font-size:11px;font-weight:650;}
.surfline .jump:hover{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 40%,transparent);}
.ring-track{fill:none;stroke:color-mix(in srgb,var(--border) 90%,transparent);stroke-width:3.2;}
.ring-fill{fill:none;stroke-width:3.4;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.ring-dot{fill:none;stroke:color-mix(in srgb,var(--st-idle) 60%,transparent);stroke-width:3.2;stroke-dasharray:0.1 5.6;stroke-linecap:round;}
.ring-num{font:800 11px ui-sans-serif,system-ui;fill:var(--text);}
.ring-gly{font:800 13px ui-sans-serif,system-ui;}
.ring-shape{fill:none;stroke-width:2.4;}  /* colourblind-safe status shape overlaid on the ring (#13) */

/* clickable live one-liner (#9) — Continue is one click from the card face */
.oneliner{display:flex;align-items:center;gap:9px;padding:10px 12px 10px 16px;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);
  color:var(--muted);font-size:12px;background:color-mix(in srgb,var(--bg) 30%,transparent);cursor:pointer;}
.oneliner:hover{background:color-mix(in srgb,var(--text) 4%,transparent);}
.oneliner .live{position:relative;width:7px;height:7px;border-radius:999px;background:var(--st-run);flex-shrink:0;}
/* only ONE pinged item animates (#20a); every other running dot is static cyan */
.oneliner.ping .live::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:1px solid var(--st-run);opacity:.55;animation:ping 1.8s ease-out infinite;}
.oneliner.block .live{background:var(--st-block);} .oneliner.fail .live{background:var(--st-fail);}
.oneliner.calm .live{background:var(--st-idle);}
.oneliner .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.oneliner .txt b{color:color-mix(in srgb,var(--text) 88%,transparent);font-weight:650;}
.oneliner .ol-act{display:flex;align-items:center;gap:6px;flex-shrink:0;}
@keyframes ping{0%{transform:scale(.6);opacity:.7;}100%{transform:scale(1.9);opacity:0;}}
@media (prefers-reduced-motion: reduce){ .oneliner .live::after{animation:none;} }

/* expanded body: workstreams */
.pbody{display:none;border-top:1px solid var(--border);padding:6px 0 8px;}
.pcard.open .pbody{display:block;}
.ws{border-top:1px solid color-mix(in srgb,var(--border) 55%,transparent);}
.ws:first-child{border-top:0;}
.ws-head{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;}
.ws-head:hover{background:color-mix(in srgb,var(--text) 4%,transparent);}
.ws-ring{width:42px;height:42px;flex-shrink:0;}
.ws-id{flex:1;min-width:0;}
.ws-name{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ws-dod{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ws-meta{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.ws-chev{color:var(--muted);transition:transform .16s ease;}
.ws.open .ws-chev{transform:rotate(90deg);}
.sess-list{display:none;padding:0 16px 8px 16px;}
.ws.open .sess-list{display:block;}
.ws-cnt{font-size:11px;color:var(--muted);}

/* session row */
.sess{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:6px 0 0;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--border) 70%,transparent);background:color-mix(in srgb,var(--panel-2) 70%,transparent);cursor:pointer;}
.sess:hover{border-color:color-mix(in srgb,var(--accent) 32%,var(--border));background:var(--panel-2);}
.sess-dot{width:9px;height:9px;border-radius:999px;flex-shrink:0;}
.sess-main{flex:1;min-width:0;}
.sess-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.sess-name{font-size:13px;font-weight:650;}
.sess-live{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-live b{color:color-mix(in srgb,var(--text) 86%,transparent);font-weight:450;}
.sess-dod{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.artchip{display:inline-flex;align-items:center;gap:7px;height:23px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:450;
  border:1px solid color-mix(in srgb,var(--st-sign) 30%,var(--border));background:color-mix(in srgb,var(--st-sign) 7%,transparent);color:color-mix(in srgb,var(--text) 90%,transparent);}
.artchip.mg{border-color:color-mix(in srgb,var(--st-merge) 32%,var(--border));background:color-mix(in srgb,var(--st-merge) 7%,transparent);}
.artchip.doc{border-color:color-mix(in srgb,var(--st-sign) 30%,var(--border));}
.artchip .ok{color:var(--st-merge);font-weight:800;}
.artchip .add{color:var(--st-merge);} .artchip .del{color:var(--st-fail);}
.recheck{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:color-mix(in srgb,var(--muted) 80%,transparent);border:0;background:transparent;padding:0 0 0 4px;}
.recheck:hover{color:var(--accent);}
.stale{color:var(--st-block);}
.sess-act{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.qnext{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.qchip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);
  border:1px dashed color-mix(in srgb,var(--border) 95%,transparent);background:transparent;}
.qchip .qn{color:color-mix(in srgb,var(--st-idle) 90%,transparent);font-weight:800;margin-right:5px;}
.qmore{font-size:11px;color:color-mix(in srgb,var(--muted) 80%,transparent);font-style:italic;}
.qsrc{font-size:11px;color:color-mix(in srgb,var(--muted) 65%,transparent);font-style:italic;}
/* iteration sparkbar for loops */
.iterspark{display:inline-flex;align-items:flex-end;gap:2px;height:16px;}
.iterspark i{width:3px;border-radius:1px;background:color-mix(in srgb,var(--st-run) 55%,transparent);}

/* ───────────── compact project rows (fleet scale) ───────────── */
.grpcard{border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--panel) 70%,transparent);overflow:hidden;margin-top:14px;}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:650;}
.grp-h:hover{background:color-mix(in srgb,var(--text) 3%,transparent);}
.grp-h .gt{letter-spacing:.05em;text-transform:uppercase;font-size:11px;font-weight:800;}
.grp-h .gt.sgn{color:var(--st-sign);}
.grp-h .gc{color:color-mix(in srgb,var(--muted) 75%,transparent);font-weight:450;}
.grp-h .chev{margin-left:auto;}
.grpcard.open .grp-h .chev{transform:rotate(90deg);}
.grp-b{display:none;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);}
.grpcard.open .grp-b{display:block;}
.prow{display:flex;align-items:center;gap:13px;padding:11px 16px;border-top:1px solid color-mix(in srgb,var(--border) 45%,transparent);cursor:pointer;}
.prow:first-child{border-top:0;}
.prow:hover{background:color-mix(in srgb,var(--text) 4%,transparent);}
.prow .pn{font-size:13px;font-weight:650;flex:0 0 auto;min-width:130px;}
.prow .pp{font-size:11px;color:color-mix(in srgb,var(--muted) 72%,transparent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow .psum{font-size:12px;color:var(--muted);flex:0 0 auto;}
.prow .psum b{color:color-mix(in srgb,var(--text) 85%,transparent);font-weight:650;}
.prow.open{background:color-mix(in srgb,var(--panel-2) 60%,transparent);}
.prow-body{display:none;background:color-mix(in srgb,var(--bg) 25%,transparent);border-top:1px solid color-mix(in srgb,var(--border) 45%,transparent);}
.prow-body.open{display:block;}

/* ───────────── done / planned surfaces ───────────── */
.done{border:1px solid var(--border);border-radius:16px;background:var(--panel);overflow:hidden;}
.done-head{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;}
.done-head:hover{background:color-mix(in srgb,var(--text) 3%,transparent);}
.done-title{font-size:13px;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:9px;}
.done-sum{color:var(--muted);font-size:12px;}
.done-sum b.s{color:var(--st-sign);} .done-sum b.m{color:var(--st-merge);} .done-sum b.p{color:var(--st-idle);}
.done-head .chev{margin-left:auto;}
.done.open .done-head .chev{transform:rotate(90deg);}
.done-body{display:none;border-top:1px solid var(--border);}
.done.open .done-body{display:block;}
.done-grp{padding:6px 0;}
.done-grp + .done-grp{border-top:1px solid color-mix(in srgb,var(--border) 55%,transparent);}
.done-grp-h{padding:10px 16px 6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted);}
.done-grp-h .sw{width:7px;height:7px;border-radius:999px;display:inline-block;}
.done-grp-h.sign{color:var(--st-sign);} .done-grp-h.sign .sw{background:var(--st-sign);}
.done-grp-h.merge{color:var(--st-merge);} .done-grp-h.merge .sw{background:var(--st-merge);}
.done-grp-h.merge.earlier{color:var(--muted);} .done-grp-h.merge.earlier .sw{background:var(--st-idle);}
.done-grp-h.plan{color:var(--st-idle);} .done-grp-h.plan .sw{background:var(--st-idle);box-shadow:inset 0 0 0 1.4px var(--st-idle);background:transparent;}
.drow{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;}
.drow:hover{background:color-mix(in srgb,var(--text) 4%,transparent);}
.drow .dleft{flex:1;min-width:0;}
.drow .dcrumb{font-size:11px;color:var(--muted);}
.drow .dcrumb b{color:var(--text);font-weight:650;}
.drow .dname{font-size:13px;font-weight:650;margin-top:2px;display:flex;align-items:center;gap:9px;}
.drow .dnote{font-size:12px;color:var(--muted);margin-top:4px;}
.morelink{display:block;padding:10px 16px;font-size:12px;color:var(--muted);background:transparent;border:0;border-top:1px solid color-mix(in srgb,var(--border) 45%,transparent);text-align:left;width:100%;}
.morelink:hover{color:var(--accent);}

/* ───────────── sign-off — first-class to-do LIST (#1): single column of light rows,
   flat panel-2 (no purple gradient / left bar), ONE purple per row (the Sign-off button) ───────────── */
.signoff{display:flex;flex-direction:column;gap:8px;}
.soff{border:1px solid var(--border);border-radius:12px;background:var(--panel-2);
  padding:11px 14px;display:flex;align-items:center;gap:16px;overflow:hidden;}
.soff:hover{border-color:color-mix(in srgb,var(--st-sign) 30%,var(--border));}
.soff.gone{opacity:.5;}
.soff .sleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.soff .scrumb{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.soff .scrumb b{color:var(--text);font-weight:650;}
.soff .scrumb .sn{color:color-mix(in srgb,var(--text) 92%,transparent);font-weight:650;}
.soff .scrit{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.soff .scrit .gk{color:color-mix(in srgb,var(--text) 88%,transparent);font-weight:650;}
.soff .scrit .pend{color:var(--st-block);font-weight:650;}
.soff .sact{display:flex;gap:8px;align-items:center;flex-shrink:0;}
/* the "+N more to sign off" overflow reuses .needmore; tighten its rows */
#signmore .needmore-b{padding:8px;display:flex;flex-direction:column;gap:8px;}
.btn.sign{background:color-mix(in srgb,var(--st-sign) 18%,transparent);border-color:color-mix(in srgb,var(--st-sign) 45%,var(--border));color:#eaddff;font-weight:800;}
.btn.sign:hover{background:color-mix(in srgb,var(--st-sign) 26%,transparent);border-color:var(--st-sign);}
.btn.sign svg{width:14px;height:14px;}

/* undo toast (optimistic sign-off flip) */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:60;
  display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--st-merge) 38%,var(--border));
  background:color-mix(in srgb,var(--st-merge) 12%,var(--panel-2));color:var(--text);font-size:13px;box-shadow:0 16px 40px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast b{font-weight:650;}
.toast .undo{border:1px solid var(--border);background:transparent;color:var(--accent);border-radius:8px;padding:5px 11px;font-weight:650;font-size:12px;}
.toast .undo:hover{border-color:var(--accent);}

/* one info glyph + tooltip replacing the repeated 'best-effort' caption (#14) */
.infg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--muted) 50%,transparent);
  color:color-mix(in srgb,var(--muted) 80%,transparent);font-size:9px;font-weight:800;cursor:help;line-height:1;}

/* session-list cap expander (#20d) */
.sessmore{display:block;width:100%;text-align:left;padding:9px 4px 4px;font-size:12px;color:var(--muted);background:transparent;border:0;}
.sessmore:hover{color:var(--accent);}

/* shape-coded session dot (#14) — status without leaning only on hue */
.sess-dot.run,.sess-dot.loop,.sess-dot.merge{border-radius:999px;}
.sess-dot.block{border-radius:2px;}
.sess-dot.sign{border-radius:2px;transform:rotate(45deg);}
.sess-dot.idle{background:transparent !important;box-shadow:inset 0 0 0 1.6px var(--st-idle);}
.sess-dot.fail{position:relative;background:transparent !important;}
.sess-dot.fail::after{content:"\00d7";position:absolute;inset:-4px 0 0;font-size:13px;line-height:1;font-weight:800;text-align:center;color:var(--st-fail);}

/* loop budget meter (#3) */
.loopBadge.warn{color:var(--st-block);border-color:color-mix(in srgb,var(--st-block) 42%,transparent);background:color-mix(in srgb,var(--st-block) 10%,transparent);}
.budget{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);}
.budget .bar{width:74px;height:5px;border-radius:999px;background:color-mix(in srgb,var(--border) 80%,transparent);overflow:hidden;}
.budget .bar i{display:block;height:100%;border-radius:999px;background:color-mix(in srgb,var(--st-run) 60%,var(--muted));}
.budget.warn .bar i{background:var(--st-block);}
.budget.warn{color:var(--st-block);}

/* calm + reassurance lines */
.calmnote{margin-top:28px;text-align:center;color:color-mix(in srgb,var(--muted) 70%,transparent);font-size:12px;}
.calmline{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--st-merge) 22%,var(--border));border-radius:14px;
  background:color-mix(in srgb,var(--st-merge) 5%,transparent);color:var(--text);font-size:13px;}
.calmline .ok{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;flex-shrink:0;
  color:var(--st-merge);border:1px solid color-mix(in srgb,var(--st-merge) 40%,transparent);background:color-mix(in srgb,var(--st-merge) 9%,transparent);font-weight:800;}
.calmline b{font-weight:650;}
.calmline .sub{color:var(--muted);font-size:12px;margin-left:2px;}

/* ───────────── first-run onboarding ───────────── */
.onboard{max-width:620px;margin:36px auto;border:1px solid var(--border);border-radius:18px;background:var(--panel);padding:30px 30px 26px;text-align:center;}
.onboard .glyph{width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent);}
.onboard .glyph svg{width:26px;height:26px;}
.onboard h2{margin:0 0 10px;font-size:20px;font-weight:800;letter-spacing:-.01em;}
.onboard p{margin:0 auto 8px;color:var(--muted);font-size:13px;max-width:480px;line-height:1.6;}
.onboard .model{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 6px;color:var(--muted);font-size:12px;}
.onboard .model .node{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);font-weight:650;color:var(--text);}
.onboard .model .arr{color:color-mix(in srgb,var(--muted) 70%,transparent);}
.onboard .actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
.onboard .disc{margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);font-size:12px;color:var(--muted);}
.onboard .disc b{color:var(--text);font-weight:650;}
.onboard .disc .cands{display:flex;flex-direction:column;gap:6px;margin-top:11px;text-align:left;}
.onboard .cand{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2);font-size:12px;}
.onboard .cand .cpath{flex:1;min-width:0;color:var(--text);}
.onboard .cand .cmeta{color:var(--muted);}

/* ───────────── conversation overlay ───────────── */
.cback{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s ease;}
.cback.show{opacity:1;pointer-events:auto;}
.conv{
  position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(740px,100vw);
  display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 96%,black);
  border-left:1px solid var(--border);box-shadow:-26px 0 70px rgba(0,0,0,.45);
  transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.61,.36,1);
}
.conv.show{transform:none;}
.focusbar{display:none;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--st-block) 8%,transparent);font-size:12px;color:var(--st-block);font-weight:650;flex-shrink:0;}
.focusbar.show{display:flex;}
.focusbar .grow{flex:1;}
.conv-head{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.conv-crumb{flex:1;min-width:0;}
.conv-crumb .cc1{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conv-crumb .cc1 b{color:var(--text);font-weight:650;}
.conv-crumb .cc2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-top:1px;display:flex;align-items:center;gap:9px;}
.conv-close{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);}
.conv-close:hover{color:var(--text);background:var(--panel-2);}
.conv-close svg{width:16px;height:16px;}

.dodbar{padding:11px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 40%,transparent);flex-shrink:0;}
.dodbar-top{display:flex;align-items:center;gap:12px;cursor:pointer;}
.dodbar .dring{width:38px;height:38px;flex-shrink:0;}
.dodbar .dtxt{flex:1;min-width:0;}
.dodbar .dt1{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;}
.dodbar .dt2{font-size:13px;color:var(--text);margin-top:3px;}
.dodbar .dexp{color:var(--muted);transition:transform .16s ease;}
.dodbar.open .dexp{transform:rotate(90deg);}
.critlist{display:none;margin-top:11px;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);flex-direction:column;gap:7px;}
.dodbar.open .critlist{display:flex;}
.crit{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted);}
.crit .box{width:15px;height:15px;border-radius:4px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:10px;font-weight:800;
  border:1px solid color-mix(in srgb,var(--border) 90%,transparent);}
.crit.met .box{background:color-mix(in srgb,var(--st-merge) 16%,transparent);border-color:color-mix(in srgb,var(--st-merge) 45%,transparent);color:var(--st-merge);}
.crit.gate .box{border-style:dashed;border-color:color-mix(in srgb,var(--st-sign) 50%,transparent);color:var(--st-sign);}
.crit .ctext{flex:1;color:color-mix(in srgb,var(--text) 86%,transparent);}
.crit.met .ctext{color:var(--muted);}
.crit .cev{font-size:12px;color:var(--muted);margin-top:2px;}
.gatepill{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:650;color:var(--st-sign);
  border:1px solid color-mix(in srgb,var(--st-sign) 40%,transparent);margin-left:4px;}

.conv-msgs{flex:1;min-height:0;overflow:auto;padding:18px 18px 26px;display:flex;flex-direction:column;gap:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,black 22px,black calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,black 22px,black calc(100% - 16px),transparent 100%);}
.m{max-width:90%;}
.m.sys{align-self:center;color:var(--muted);font-size:11px;text-align:center;margin:6px 0 14px;max-width:100%;}
.m.user{align-self:flex-end;background:var(--user,#1e3a5f);border:1px solid color-mix(in srgb,#1e3a5f 60%,var(--border));
  border-radius:14px;padding:11px 13px;margin:10px 0;font-size:13px;}
.m.ai{align-self:stretch;max-width:100%;font-size:13px;line-height:1.6;margin:8px 0;}

/* ════════════════════════════════════════════════════════════════════
   GROUNDING NOTE — every rendered field maps to the pi grounding spec.

   PROGRESS (never authored): ProgressSnapshot.percent = metWeight/totalWeight over the
     DoDCriterion[] where !gate (#7 adds gate?:boolean to the type; auto sources are never gated).
     The ring is a SEGMENTED gauge — one arc per criterion, filled=met — so a percent always reads
     as "k of n met" and traces to a checkbox / git fact / exit code; segments collapse to a single
     proportional arc only past n>6 (#15) so it never becomes a ring of dashes.
   FRESHNESS (#5): command criteria are evaluated ON-DEMAND (/api/dod/evaluate) + cached with
     evaluatedAt — never on rollup render. A never-run command criterion is EXCLUDED from the
     denominator (drawn as a faint "not yet checked" segment + an asterisked "k/n" number, never a
     confident percent); a stale one (ran, but not recently) likewise asterisks the number.
     ProgressSnapshot.allMet — which gates the sign-off promotion — requires every evaluable criterion
     to be RUN and FRESH, so a card never promotes to "awaiting sign-off" on hours-stale evidence; if
     it would, it shows "done — pending recheck" with a re-check on the card face. A neutral
     "evaluating" ring (pulsing track, no number) covers the two-phase load gap and on-demand rechecks.
   MIXED SOURCES (#5): when a workstream's sessions span >1 evaluator family we do NOT blend
     heterogeneous criteria into one percent. The ws ring becomes a "k of n SESSIONS done" gauge
     (one segment per session) with a "mixed sources" note. Criteria-blended percent is reserved
     for the homogeneous-source case only. NOTE (#13): this mock detects the family via a label-text
     regex (srcFamily()/sessFamily()) purely for the fixture; production keys mixed-source/evaluator
     detection off the structured DoDSource.kind on each criterion, never substring matching.
   DOC RECEIPTS (#13): a no-git workstream's artifact "N files / note path" is derived from the
     session's own write/edit tool_result entries (the only file-write signal pi exposes) — stated
     alongside git numstat as the receipt source; verification is the user's review, not a merge.
   DoD = PROVENANCE × EVALUATOR (#18): authoredBy ∈ user|agent|orchestrator|rule (the pill at rest)
     is separate from the evaluator kind that actually computes met-ness:
       manual          → stored boolean in ProjectRegistry (toggled by PATCH /api/dod/criterion/:id)
       git_clean/_merged/_ahead_zero → gitStatus()/gitLog()/`git merge-base --is-ancestor` (cheap, inline)
       command         → executeBash exit===expect, ON-DEMAND only (/api/dod/evaluate) + evaluatedAt + stale flag
       session_idle    → runtimeForPath() + agent_end(pending 0)
     Every criterion resolves to one of those real evaluators — no pill is a phantom source.
   SIGN-OFF (#6,#7,#10): a manual user-approval criterion is a GATE excluded from percent. Evaluable
     criteria reach 100% → status flips to purple "awaiting sign-off". Row-level "Sign off" =
     PATCH /api/dod/criterion/:id flipping that one gate (fully supported today): optimistic flip +
     undo toast, no drawer. MERGE is a SEPARATE step — there is NO push/PR/merge route in the local-only
     git layer, so it is either a net-new git-merge endpoint (called out as new work) or an agent prompt
     ("merge feat/x into main"). We never label one button "Sign off & merge".
   STATUS (WorkItemStatus, derived): runtime.isRunning → run/loop · git 'conflicted' OR
     tool_execution_end(error)/abnormal agent_end → block/fail · evaluable 100% + pending manual gate →
     sign · evaluable 100% (auto) → merge · else queued/planned/unset.
   BLOCK detection (#9): "blocked · needs input" + quick-reply chips REQUIRE a structured elicitation —
     extension_ui_request / a proposed ask_user tool whose payload is {sessionId, question, options[]}
     (added to proposedApi) — or a real permission prompt. s.elicited marks those. A non-elicited
     free-text stop CANNOT be proven a blocker, so it degrades to a quiet "Idle · may be waiting
     (N min since agent_end, unread)" — never a fabricated amber alarm.
   FAIL + BLAST (#17): 'fail' is derived from pi_event tool_execution_end(error)/abnormal agent_end and
     git 'conflicted', NOT from a dashboard-initiated command-DoD eval (which is on-demand and may be
     stale — a red command criterion shows its evaluatedAt separately). 'blast' has no dependency graph
     to draw on, so blast = manual override OR destructive-keyword regex over the last assistant message
     OR a dirtyCount bucket; it ONLY orders Needs-you triage and gates nothing.
   LOOPS (#6, DURABLE): isLoop:boolean + budget?{maxMinutes?,maxCostUsd?} + loopStartedAt:string are
     STORED in the registry (net-new fields), never inferred. ELAPSED is computed from loopStartedAt
     (NOT runtimeForPath, which resets on the 60s idle dispose); COST from SessionStats. iteration count
     + sparkbar are REBUILT from per-iteration CustomEntry('pi-web:loop-iter',{n,startedAt,toolEnds,cost})
     and from tool_result ENTRIES in the JSONL — durable across dispose — NOT from ephemeral
     agent_start/agent_end/tool_execution_end /ws events that die on dispose. So a 38m loop reconstructs
     its count and can actually trip over-budget. GIT-DERIVED DoD freshness: a TTL poll (gitStatus +
     merge-base, ~15–30s, visible active cards only) or an fs/git watcher emitting debounced,
     dirty-project-scoped rollup_changed{projectId} — so merges done OUTSIDE pi still go live.
     iteration (legacy note) = one agent_start→agent_end cycle with no intervening user message; the sparkbar =
     tool_execution_end events per iteration span returned ON the rollup (not the /ws firehose), so a
     flat/declining tail signals a stall. budget {maxMinutes?,maxCostUsd?} is compared to
     SessionStats.cost + elapsed; the loop badge flips amber ONLY when stalled or over budget. Pause =
     AgentSession.abort() + a registry 'paused' flag the orchestrator honours.
   PLAN QUEUE: BEST-EFFORT parsed from agent notes — pi has no TodoWrite/plan primitive (a plan-tool
     extension writing CustomEntry items would replace it); flagged with one info glyph, not prose.
   DELTA (#11): "since last visit" diffs modified/mergedAt + criterion evaluatedAt against a stored
     lastDashboardVisitAt (in the UI sidecar). Net +/− = numstat over commits since the visit. If
     lastVisitAt is unavailable we say "Recent activity", never a fabricated interval.
   ROLLUP VIEW-MODELS (#8): SessionRollup carries live, elicitation?{question,options[]}, blast,
     failAction, loop?{iter,sparks[],startedAt,budget}, plannedQueue?{items,total,source},
     dod?{text,sourceLabel,authoredBy,criteria:CriterionEval[]} (text+evaluator+gate+evidence+evaluatedAt);
     WorkstreamRollup adds dodSummary+mixed+loop?; ProjectRollup adds lineage?{parentProjectName,fullPath}.
   NESTING (#18): a session belongs to exactly ONE project = the registry root that is the LONGEST
     prefix of session.cwd (explicit sessionIds override), so ai-education-in-zippy never double-counts
     toward zippy. The lineage badge rides into renderRow so it survives compact/dormant rows.
   LOAD/REALTIME (two-phase): first paint = registry + runtime only; git/DoD stream per card lazily with

     per-project rollup_changed and ignores message_update/tool_execution_update from the /ws firehose.
   ════════════════════════════════════════════════════════════════════ */

/* attention rank (#3) — block/fail first … merged last */
const STATUS_RANK = { block:0, fail:0, unset:1, run:2, loop:2, sign:3, queued:4, planned:4, merge:5 };
function statusRank(st){ return STATUS_RANK[st]!=null?STATUS_RANK[st]:9; }
function byAttention(a,b){ return statusRank(a.status)-statusRank(b.status); }

/* ── DoD freshness (#5): command criteria are evaluated ON-DEMAND and cached, never on rollup render.
   A never-run command criterion isn't evaluable yet; a stale one (ran, but not recently) can't back a
   100% / a sign-off promotion. isRecent() is intentionally generous; critStale() is the stricter gate. */
function critUnrun(c){ return c.src==="command" && (!c.at || /never/i.test(c.at)); }
function critStale(c){
  if(c.src!=="command" || c.gate || critUnrun(c)) return false;
  const a=(c.at||"").toLowerCase();
  if(a==="snapshot" || a.includes("manual review") || a.includes("folder")) return false; // not a clock-bound eval
  return /(h ago|d ago|yesterday|day|week)/.test(a);  // ran, but the cached result is old → stale
}

/* ── progress derivation (#1,#4,#5): percent over EVALUATED non-gate criteria.
   never-run command criteria are excluded from the denominator (shown as an unfilled "not yet checked"
   segment + an asterisked "k/n" number, never folded into a flattering percent). allMet (which gates the
   sign-off promotion) requires every evaluable criterion to be RUN and FRESH. */
function computeProgress(crit){
  if(!crit || !crit.length) return null;
  const evaluable = crit.filter(c=>!c.gate);
  if(!evaluable.length) return {met:0,total:0,metW:0,totW:0,percent:0,allMet:false,gateOnly:true,unrun:0,stale:0};
  const run = evaluable.filter(c=>!critUnrun(c));
  const unrun = evaluable.length - run.length;
  const stale = run.filter(critStale).length;
  let metW=0, totW=0, metN=0;
  run.forEach(c=>{ const w=c.weight||1; totW+=w; if(c.met){metW+=w; metN++;} });
  return { met:metN, total:run.length, metW, totW,
    percent: totW?Math.round(metW/totW*100):0,
    allMet: run.length>0 && metW===totW && unrun===0 && stale===0,
    unrun, stale };
}
function pendingGate(crit){ return (crit||[]).find(c=>c.gate && !c.met) || null; }
/* a sign-status session that's resting on stale/unrun command evidence — can't be signed off yet (#5) */
function signPending(s){ return s.status==="sign" && s._prog && (s._prog.unrun>0 || s._prog.stale>0); }

/* classify a DoD source string into its evaluator family (label only — no colour, per #5) */
function srcFamily(src){
  const s=(src||"").toLowerCase();
  if(s.includes("merge")||s.includes("branch")||s.includes("clean")||s.includes("ahead")) return "git";
  if(s.includes("rule")||s.includes("test")||s.includes("command")||s.includes("exit")) return "cmd";
  if(s.includes("user")||s.includes("sign")) return "user";
  return "";
}

/* ─────────────────────────── scenario registry ─────────────────────────── */
const SCENARIOS = {
  default:{ label:"Default · canonical world", data:WORLD_DEFAULT },
  single: { label:"Single project · many rings", data:WORLD_SINGLE },

  blocked:{ label:"Five agents waiting · 6 blocked", data:WORLD_BLOCKED },
  loop:   { label:"Growing loop · queue 3→17", data:WORLD_LOOP },
  nogit:  { label:"Research · no repo, no git DoD", data:WORLD_NOGIT },
  mixed:  { label:"Six definitions of done", data:WORLD_MIXED, openFirst:true },
  empty:  { label:"Cold start · first run", data:[], empty:true, candidates:3 },
};

/* ─────────────────────────── live state + enrichment ─────────────────────────── */
const state = { scn:"default", data:WORLD_DEFAULT, SESS:{}, focus:null, lastVisit:"2h ago", signed:{} };

/* derive _prog on every session + workstream so the ring can NEVER drift from criteria (#1) */
function enrich(data){
  data.forEach(p=>p.workstreams.forEach(w=>{
    w.sessions.forEach(s=>{ s._prog = computeProgress(s.crit); s._gate = pendingGate(s.crit);
      if(s.loop){ s._loop = loopHealth(s); s._loopWarn = s._loop.warn; } });
    w._loopWarn = w.sessions.some(s=>s._loopWarn);
    // mixed-source guard (#5): if the workstream's sessions span >1 evaluator family, do NOT blend
    // heterogeneous criteria into one percent — switch the ring to a "k of n SESSIONS done" gauge.
    const fams = new Set(w.sessions.filter(s=>s.status!=="unset").map(sessFamily));
    w._mixed = fams.size > 1;
    if(w._mixed){
      const total=w.sessions.length, done=w.sessions.filter(sessionDone).length;
      w._sessGauge = { done, total, percent: total?Math.round(done/total*100):0 };
      w._prog = null;
    } else {
      w._crit = w.sessions.reduce((a,s)=>a.concat(s.crit||[]), []);
      w._prog = computeProgress(w._crit);
    }
  }));
}

function loadScenario(id){
  const sc = SCENARIOS[id] || SCENARIOS.default;
  state.scn = id; state.data = sc.data; state.SESS = {};
  enrich(state.data);
  state.data.forEach(p=>p.workstreams.forEach(w=>w.sessions.forEach(s=>{ state.SESS[s.id]={s,w,p}; })));
  closeConv();
  renderAll(sc);
  if(sc.openFirst){ requestAnimationFrame(()=>{ const c=document.querySelector(".pcard"); if(c){c.classList.add("open"); const w=c.querySelector(".ws"); if(w&&state.scn==="mixed") w.classList.add("open");} }); }
}

/* ─────────────────────────── small helpers ─────────────────────────── */
const esc = t => String(t==null?"":t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const isNeed = st => st==="block" || st==="fail";
const isRecent = ago => /(^now|sec|min|m ago|h ago|hour)/i.test(ago||"");
/* blast radius (#11): manual priority OR heuristic (destructive keyword + dependents + dirty) */
function blastRadius(s){
  if(s.blast) return s.blast;
  const t=((s.live||"")+" "+(s.name||"")).toLowerCase();
  if(/(drop|delete|destroy|migrat|irrevers|\brm\b|--force|reset --hard|truncate)/.test(t)) return "hi";
  return "lo";
}
const blastRank = b => b==="hi"?0 : b==="md"?1 : 2;
const blastLabel = b => b==="hi"?"high blast radius" : b==="md"?"elevated blast radius" : "low blast radius";

/* loop health (#3): a loop is healthy until it STALLS (flat/declining spark tail) or runs OVER budget.
   Only then does its badge go amber — growth of the planned queue is expected and never alarming. */
function loopHealth(s){
  const b=s.budget||{};
  const overTime = b.maxMinutes!=null && s.elapsedMin!=null && s.elapsedMin>b.maxMinutes;
  const overCost = b.maxCostUsd!=null && s.cost!=null && s.cost>b.maxCostUsd;
  let stalled=false;
  const sp=s.iterspark;
  if(sp && sp.length>=4){ const tail=sp.slice(-4); stalled = tail.every((v,i)=> i===0 || v<=tail[i-1]) && tail[tail.length-1]<=tail[0]; }
  const over = overTime||overCost;
  const pctTime = b.maxMinutes!=null && s.elapsedMin!=null ? Math.min(100,Math.round(s.elapsedMin/b.maxMinutes*100)) : null;
  const pctCost = b.maxCostUsd!=null && s.cost!=null ? Math.min(100,Math.round(s.cost/b.maxCostUsd*100)) : null;
  let reason="";
  if(over) reason = overTime&&overCost?"over time + cost budget" : overTime?"over time budget" : "over cost budget";
  else if(stalled) reason="stalled — flat iteration tail";
  return { warn:over||stalled, over, stalled, reason, pctTime, pctCost, b };
}

/* a session has reached its DoD (used by the mixed-source k-of-n session gauge, #5) */
function sessionDone(s){ return s.status==="merge" || s.status==="sign" || !!(s._prog && s._prog.allMet); }
/* evaluator family of a SESSION's DoD source label (for the mixed-source check) */
function sessFamily(s){
  const sl=(s.dodSrc||"").toLowerCase();
  if(sl.includes("merge")||sl.includes("branch")||sl.includes("clean")||sl.includes("ahead")) return "git";
  if(sl.includes("rule")||sl.includes("command")||sl.includes("test")||sl.includes("exit")) return "cmd";
  if(sl.includes("user")||sl.includes("sign")) return "user";
  if(sl.includes("agent")) return "agent";
  if(sl.includes("orchestr")) return "orch";
  return "other";
}

/* ─────────────────────────── SEGMENTED progress ring (#1,#5,#15) ───────────────────────────
   met = freshly-met run criteria · runTotal = evaluated criteria (denominator) · unrun = never-run
   command criteria, drawn as faint thin "not yet checked" segments so the ring never reads complete. */
function segArcs(met, runTotal, unrun, percent, color){
  const r=15.5, C=2*Math.PI*r, n=runTotal+unrun;
  if(n>6){ // past 6 criteria → one clean proportional arc over the RUN criteria (#15)
    const off=C*(1-(runTotal?met/runTotal:0));
    const faint = unrun?`<circle cx="18" cy="18" r="${r}" fill="none" stroke="color-mix(in srgb,var(--st-idle) 42%,transparent)" stroke-width="1.6" stroke-dasharray="2 3"/>`:"";
    return faint+`<circle class="ring-fill" cx="18" cy="18" r="${r}" stroke="${color}" stroke-dasharray="${C} ${C}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/>`;
  }
  const seg=C/n, gap=Math.min(seg*0.22, 3.4), dash=Math.max(seg-gap,1.4);
  let out="";
  for(let i=0;i<n;i++){
    const isUnrun = i>=runTotal;
    const stroke = i<met ? color : (isUnrun ? 'color-mix(in srgb,var(--st-idle) 45%,transparent)' : 'var(--seg-off)');
    const sw = isUnrun ? 1.6 : 3.4;
    const da = isUnrun ? `${(dash*0.5).toFixed(2)} ${(C-dash*0.5).toFixed(2)}` : `${dash.toFixed(2)} ${(C-dash).toFixed(2)}`;
    out+=`<circle cx="18" cy="18" r="${r}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="butt" `+
      `stroke-dasharray="${da}" stroke-dashoffset="${(-i*seg).toFixed(2)}" transform="rotate(-90 18 18)"/>`;
  }
  return out;
}
/* colourblind-safe status SHAPE at the 12-o'clock cap of a progress ring (#13: enlarged to ~5px):
   circle=run · square=block · diamond=sign · ×=fail — so a blocked 50 ≠ a running 50 without hue. */
function ringShape(st, color){
  if(st==="run") return `<circle cx="18" cy="3.6" r="2.7" fill="${color}"/>`;
  if(st==="block") return `<rect x="15.3" y="0.9" width="5.4" height="5.4" rx="0.7" fill="${color}"/>`;
  if(st==="sign") return `<rect x="15.4" y="1" width="5.2" height="5.2" fill="${color}" transform="rotate(45 18 3.6)"/>`;
  if(st==="fail") return `<text x="18" y="7.6" text-anchor="middle" font-size="11" font-weight="800" fill="${color}">×</text>`;
  return "";
}
/* item = a session or workstream carrying .status, ._prog (or ._sessGauge for mixed), .loop
   opts.neutral → strip the alarm hue (used for surfaced block/fail rings, #13) */
function ringSvg(item, size, opts){
  const o=opts||{}, r=15.5, C=2*Math.PI*r, st=item.status;
  const hue=(ST[st]&&ST[st].color)||"var(--st-idle)";
  const color = o.neutral ? "color-mix(in srgb,var(--muted) 70%,transparent)" : hue;
  const wrap=(inner,track)=>`<svg class="ring" viewBox="0 0 36 36" style="width:${size}px;height:${size}px">${track?`<circle class="ring-track" cx="18" cy="18" r="${r}"/>`:""}${inner}</svg>`;
  // phase-2 / on-demand eval (#5): pulsing track, no number, no status hue — "evaluating, not yet known"
  if(item._evaluating) return `<svg class="ring" viewBox="0 0 36 36" style="width:${size}px;height:${size}px"><circle class="ring-track eval" cx="18" cy="18" r="${r}"/></svg>`;
  if(st==="merge") return wrap(`<circle class="ring-fill" cx="18" cy="18" r="${r}" stroke="${color}" stroke-dasharray="${C} ${C}" stroke-dashoffset="0" transform="rotate(-90 18 18)"/><text class="ring-gly" x="18" y="22.5" text-anchor="middle" fill="${color}">✓</text>`, true);
  if(st==="loop"||item.loop){ const lh=item._loopWarn; const lc=lh?"var(--st-block)":color;
    return wrap(`<circle class="ring-dot" cx="18" cy="18" r="${r}" style="stroke:color-mix(in srgb,${lh?'var(--st-block)':'var(--st-run)'} 55%,transparent)"/><text class="ring-gly" x="18" y="22.8" text-anchor="middle" fill="${lc}">∞</text>`, true); }
  if(st==="queued"||st==="planned") return wrap(`<circle class="ring-dot" cx="18" cy="18" r="${r}"/><text class="ring-gly" x="18" y="22.6" text-anchor="middle" fill="var(--st-idle)">·</text>`, true);
  // mixed-source workstream → "k of n SESSIONS done" gauge (#5), neutral hue, never a blended percent
  if(item._sessGauge){
    const g=item._sessGauge;
    return wrap(`${segArcs(g.done, g.total, 0, g.percent, 'color-mix(in srgb,var(--muted) 78%,transparent)')}${ringShape(st,o.neutral?color:hue)}<text class="ring-num" x="18" y="22.2" text-anchor="middle" font-size="9">${g.done}/${g.total}</text>`, false);
  }
  const prog=item._prog;
  if(st==="unset" || !prog || (prog.total===0 && !prog.unrun)) return wrap(`<circle class="ring-dot" cx="18" cy="18" r="${r}" style="stroke:color-mix(in srgb,var(--st-sign) 55%,transparent)"/><text class="ring-gly" x="18" y="22.5" text-anchor="middle" fill="var(--st-sign)">?</text>`, true);
  // stale / never-run command evidence (#5): show "k/n*" muted instead of a confident percent
  const showFrac = prog.unrun>0 || prog.stale>0;
  const numTxt = showFrac ? `${prog.met}/${prog.total}*` : `${prog.percent}`;
  const numFill = showFrac ? 'color-mix(in srgb,var(--muted) 88%,transparent)' : (o.neutral?color:'var(--text)');
  const numSize = showFrac ? 8.5 : 11;
  return wrap(`${segArcs(prog.met, prog.total, prog.unrun||0, prog.percent, color)}${ringShape(st,o.neutral?color:hue)}<text class="ring-num" x="18" y="22.6" text-anchor="middle" font-size="${numSize}" fill="${numFill}">${numTxt}</text>`, false);
}

function badge(status, soft){
  const m=ST[status]; if(!m) return "";
  if(status==="block" && soft) return `<span class="badge paused"><span class="d"></span>Paused</span>`;
  return `<span class="badge ${m.cls}"><span class="d"></span>${m.label}</span>`;
}
function srcTag(src){ return `<span class="srcTag" title="DoD source: ${esc(src)}">${esc(src)}</span>`; }
function dodInline(dod, src){ return `${esc(dod)} ${srcTag(src)}`; }

/* dot-strip: one shape-coded dot per workstream (compact rows + onboarding only, per #15) */
function dotStrip(p){
  return `<span class="dotstrip">`+p.workstreams.map(w=>{
    const cls = ST[w.status]?ST[w.status].cls:"idle";
    return `<span class="d ${cls}" title="${esc(w.name)} · ${esc((ST[w.status]||{}).label||w.status)}"></span>`;
  }).join("")+`</span>`;
}

/* per-project counts */
function projNeeds(p){ let you=0,fail=0,sign=0,run=0; p.workstreams.forEach(w=>w.sessions.forEach(s=>{
  if(s.status==="block") you++; if(s.status==="fail") fail++; if(s.status==="sign") sign++; if(s.status==="run"||s.status==="loop") run++; })); return {you,fail,sign,run}; }
function pClass(p){ const c=projNeeds(p); if(c.you||c.fail) return "attn"; if(c.run) return "active"; if(c.sign) return "signoff"; return "calm"; }
function firstSessId(p, statuses){ for(const w of p.workstreams) for(const s of w.sessions) if(statuses.includes(s.status)) return s.id; return null; }

/* representative live one-liner (#11): SKIP items already surfaced in Needs-you so the card never
   restates a blocker it can't action better than the Needs-you card. If the project is nothing BUT
   needs, point up instead of offering a redundant Continue. */
function cardLive(p){
  let best=null, bestW=null, bestRank=99, needCount=0, topNeedW=null;
  p.workstreams.forEach(w=>w.sessions.forEach(s=>{
    if(isNeed(s.status)){ needCount++; if(!topNeedW) topNeedW=w; return; }
    const rk=statusRank(s.status);
    if(rk<bestRank){ bestRank=rk; best=s; bestW=w; }
  }));
  if(!best){
    if(needCount) return {tone:"block", loop:false, pointUp:"sec-needs", txt:`${topNeedW?topNeedW.name:'This project'} — answer in Needs you`, id:null};
    return {tone:"calm", loop:false, txt:"All quiet.", id:null};
  }
  const st=best.status;
  if(st==="run"||st==="loop") return {tone:st==="loop"?"loop":"run", loop:st==="loop", txt:best.live, id:best.id};
  if(st==="unset") return {tone:"calm", loop:false, txt:`${bestW.name} — no Definition of Done set yet`, id:best.id};
  if(st==="sign")  return {tone:"calm", loop:false, pointUp:"sec-signoff", txt:"Done per its DoD — sign off above", id:best.id};
  if(st==="queued"||st==="planned") return {tone:"calm", loop:false, txt:best.live, id:best.id};
  return {tone:"calm", loop:false, txt:"All work merged. Nothing pending.", id:best.id};
}

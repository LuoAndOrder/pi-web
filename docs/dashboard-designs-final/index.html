/* ═══════════════════════════ master render ═══════════════════════════ */
function renderAll(sc){
  const wrap = document.getElementById("wrap");
  if(sc.empty){ wrap.innerHTML = onboardHtml(sc.candidates||0); bindOnboard(); return; }

  const counts = fleetCounts();
  // pick ONE ping target for the whole page (#20a) — the liveliest running/looping session
  state._pingId = (function(){ let best=null,rk=99; Object.values(state.SESS).forEach(({s})=>{
    if(s.status==="run"||s.status==="loop"){ const r=statusRank(s.status); if(r<rk){rk=r;best=s.id;} } }); return best; })();
  wrap.innerHTML = `
    <section class="hero">${heroHtml(counts)}<div class="rail" id="rail"></div></section>
    ${needsSectionHtml(counts)}
    ${signoffSectionHtml(counts)}
    ${projectsSectionHtml(counts)}
    ${plannedSectionHtml(counts)}
    ${doneSectionHtml(counts)}
    ${tailNoteHtml(counts)}
  `;
  renderRail(counts);
  renderNeeds();
  renderSignoff();
  renderGrid();
  renderPlanned();
  renderDone();
}

/* projects whose only state is merged/queued — collapsed into the "Healthy & dormant" group.
   ONE canonical definition, reused by the grid, Done, Planned, rail and hero (#12). */
function dormantIds(){ return new Set(state.data.filter(p=>pClass(p)==="calm").map(p=>p.id)); }

function fleetCounts(){
  const c={run:0,loop:0,block:0,softwait:0,sign:0,plan:0,merge:0,fail:0,unset:0,total:0,projects:state.data.length};
  const dorm=dormantIds();
  Object.values(state.SESS).forEach(({s,p})=>{
    c.total++;
    const inDorm=dorm.has(p.id);
    if(s.status==="run") c.run++;
    else if(s.status==="loop") c.loop++;
    // only a STRUCTURALLY-ELICITED block is a provable obligation (spec §5.3); a non-elicited idle stop
    // is a separate quiet "may be waiting" tally that NEVER enters the hero "things need you" count.
    else if(s.status==="block"){ if(s.elicited) c.block++; else c.softwait++; }
    else if(s.status==="sign") c.sign++;
    // Merged + Planned tallies count only NON-dormant projects so every jump-link lands on a
    // surface whose count matches what Done / Planned actually render (#12).
    else if(s.status==="queued"||s.status==="planned"){ if(!inDorm) c.plan++; }
    else if(s.status==="merge"){ if(!inDorm) c.merge++; }
    else if(s.status==="fail") c.fail++;
    else if(s.status==="unset") c.unset++;
  });
  c.active = c.run + c.loop;
  c.needs = c.block + c.fail;
  c.healthy = dorm.size;
  return c;
}

/* since-last-visit DIGEST (#7) — a real status-transition diff against a STORED lastDashboardVisitAt,
   not a merges-only line. Recent merges count FLEET-WIDE (incl. dormant) so calm-collapse never erases
   throughput; numstat is demoted to the merged fragment's tooltip; each fragment is a jump-link. */
const fmtN = n => n>=1000?(n/1000).toFixed(1)+"k":n;
const shortWs = nm => String(nm||"").replace("Nightly ","").replace("Spike: ","").replace(" loop","");
/* live loop label = elapsed ONLY, and that elapsed traces to the SINGLE grounded source (the stored
   loopStartedAt, encoded in fixtures as the numeric elapsedMin). The old loopElapsed() text-parse of the
   free-text meta/loopTime string has been DELETED (round-3 adv-fix C1/C2) so no badge can ever re-derive
   elapsed from un-grounded free text — every loop badge now flows through loopMinutes()/fmtMin like the
   hero, giving one un-desyncable signal. The "· iter N" count still needs a durable iteration log pi does
   not expose, so it is never shown live (proposed band only, #D). */
function fleetDelta(){
  let merges=0, add=0, del=0, blocked=0;
  // "since your last visit" must mean SINCE the stored lastDashboardVisitAt — not a fixed "few hours"
  // window. A merge older than the visit (e.g. 3h/5h ago vs a 2h-ago visit) is NOT new and must not count
  // (#8 nit): compare each item's age against the visit age instead of the generous isRecent() heuristic.
  const visitMin = agoToMin(state.lastVisit);
  const sinceVisit = ago => { const m=agoToMin(ago); return m<1e9 && m<=visitMin; };
  Object.values(state.SESS).forEach(({s,w})=>{
    if(s.status==="merge" && sinceVisit((s.artifact&&s.artifact.mergedAgo)||(w&&w.mergedAgo)||"")) {
      merges++; if(s.artifact){ add+=s.artifact.add||0; del+=s.artifact.del||0; } }
    if(s.status==="block" && s.elicited && sinceVisit(s.meta)) blocked++;   // newly (provably) blocked since the visit
  });
  // No "ready to sign off" delta (#7): a sign-off becoming ready needs a became-allMet timestamp vs
  // lastDashboardVisitAt that no signal grounds — so we never assert the standing sign-off backlog as
  // "new since your visit" (it would restate the count a third time after the rail pill + strip header).
  // No "+N iters" fragment — loop iteration counts need a durable iteration log pi can't ground (carry-fwd #D).
  return {merges, add, del, blocked, since:state.lastVisit};
}
function deltaClause(needs){
  const d=fleetDelta();
  const frags=[];
  if(d.merges){ const net=(d.add||d.del)?` <span class="dnums">+${fmtN(d.add)}/−${fmtN(d.del)} lines</span>`:"";
    const tip=(d.add||d.del)?"net git numstat over commits merged since your last visit":"merged since your last visit";
    frags.push(`<a data-jump="sec-done" title="${esc(tip)}"><b>+${d.merges}</b> merged${net}</a>`); }   // #9f: numstat shown INLINE, not just tooltip
  // #9d: suppress 'newly blocked' when something needs you — the hero headline already states the needs
  // count, so restating "+N newly blocked" here would double-assert the same obligation.
  if(d.blocked && !needs) frags.push(`<a data-jump="sec-needs"><b>${d.blocked}</b> newly blocked</a>`);
  if(!frags.length) return "";
  const head = d.since ? `Since you last looked <b>${esc(d.since)}</b>` : `Recent activity`;
  return `<span class="delta">${head}: ${frags.join('<span class="sep">·</span> ')}.</span>`;
}

/* longest grounded loop elapsed (#8): from the stored loopStartedAt (fixtures carry the numeric
   elapsedMin = now − loopStartedAt — every loop session sets it). Lets the calm hero stay honest — it
   never reassures "close this tab" while a loop has visibly been running a long time; it states the
   neutral elapsed FACT instead, never an invented stall / over-budget alarm. */
function loopMinutes(s,w){
  // (#it5-p7c / round-2 adv-fix) PRODUCTION: gate the "∞ looping {elapsed}" badge strictly on a
  // registered loop (isLoop) + a stored loopStartedAt (spec §5.4); elapsed = now − loopStartedAt.
  // The mockup encodes that grounded value as the numeric elapsedMin on every loop fixture. The old
  // meta/loopTime text-parse fallback (which the comment said "must never ship") has been DELETED so
  // the demo can never silently render the banned path — an un-grounded loop yields 0, not a parsed
  // string. (w is retained for signature compatibility with callers.)
  return s.elapsedMin!=null ? s.elapsedMin : 0;
}
function fmtMin(min){ if(min>=60){ const h=Math.floor(min/60), m=min%60; return m?`${h}h ${m}m`:`${h}h`; } return `${min}m`; }
/* workstream-level grounded loop elapsed (round-3 adv-fix C1/C2): a loop workstream's badge derives its
   elapsed from the SAME stored loopStartedAt as everything else — take the max elapsedMin across the
   workstream's loop sessions. No free-text loopTime parse; an un-grounded loop workstream yields 0m, not
   a banned string. fmtMin formats it so the ws badge, the per-row badge, the drawer line and the hero are
   one signal that cannot silently desync. */
function wsLoopMinutes(w){
  let best=0; (w.sessions||[]).forEach(s=>{ if(s.loop){ const m=loopMinutes(s,w); if(m>best) best=m; } });
  return best;
}
function longestLoop(){
  let best=null;
  Object.values(state.SESS).forEach(({s,w})=>{ if(s.loop){ const min=loopMinutes(s,w); if(!best||min>best.min) best={min, label:fmtMin(min)}; } });
  return best;
}
const CLOSE_TAB_LOOP_MIN = 45;  // beyond this, an actively-running loop makes "close this tab" dishonest

/* ─────────────────────────── hero ─────────────────────────── */
function heroHtml(c){
  const day = "Sunday · 21 Jun";
  // non-elicited idle stops are a quiet tally, NEVER part of the obligation headline (spec §5.3, #5)
  const maybe = c.softwait ? `<span class="maybe" title="non-elicited idle stops — pi can't PROVE these are blocked (a free-text stop is not a structured ask), so they're a quiet tally, never inside the 'things need you' count. Until a structured ask_user primitive ships, this soft-wait state is the production-dominant case."><b>${c.softwait}</b> may be waiting</span>` : "";
  if(c.needs===0){
    const bits=[];
    if(c.loop) bits.push(`${c.loop} loop${c.loop>1?"s":""} running`);
    if(c.run) bits.push(`${c.run} task${c.run>1?"s":""} running`);
    const runTxt = bits.length? bits.join(" · ") : "nothing running";
    // hero states the calm truth and names the ONE remaining obligation if there is one (sign-offs).
    // No stalled-loop / over-budget alarm here — that needs an iteration log pi can't ground (carry-fwd #D).
    // The obligation count (#1) and the run/loop count each live in exactly ONE place across headline+subline:
    //  · sign>0  → headline states the sign-off; subline carries ONLY loop/run (mirrors the needs>0 branch).
    //  · sign==0 → headline already states "{runTxt} … can wait"; subline does NOT repeat loop/run (#5,#9b).
    let headline; const subBits=[];
    if(c.sign){
      headline = `<em class="sign">${c.sign} done</em> — your sign-off is all that's pending.`;
      if(c.loop) subBits.push(`<b>${c.loop} loop${c.loop>1?"s":""}</b> running`);
      if(c.run) subBits.push(`<b>${c.run} running</b>`);
    } else {
      headline = `<em class="calm">Nothing needs you.</em> ${esc(runTxt)}, everything else can wait.`;
    }
    if(c.plan) subBits.push(`<b>${c.plan} planned</b>`);
    if(maybe) subBits.push(maybe);
    // "close this tab" ONLY when truly nothing is pending — no needs, no sign-offs. But never reassure
    // "close this tab" while a grounded loop has visibly run a long time (#8): state the neutral elapsed
    // fact (from the stored loopStartedAt) instead — a non-amber fact, never an invented stall/budget alarm.
    let closeTab="";
    if(c.sign===0 && c.needs===0){
      const ll=longestLoop();
      closeTab = (ll && ll.min>=CLOSE_TAB_LOOP_MIN) ? ` Longest loop running <b>${esc(ll.label)}</b>.` : " You can close this tab.";
    }
    const dc = deltaClause(c.needs);
    // (#it7-p6) the delta clause carries its own leading "·" separator (CSS .delta::before), so the
    // trailing period that closes the running/loop bits is suppressed when a delta follows it —
    // otherwise the single most-read line renders an awkward "may be waiting. · Since you last looked".
    return `<div class="eyebrow">${day} · everything in one quiet view</div>
      <h1 class="headline">${headline}</h1>
      <p class="subline">${subBits.join(" · ")}${subBits.length&&!(dc&&!closeTab)?".":""}${closeTab}${dc}</p>`;
  }
  const subBits=[];
  // (#it5-p4) frame the running spread against projects that ACTUALLY have running/looping work
  // ("active projects"), not the whole fleet — "across 51 projects" wrongly counts ~38 dormant
  // projects the reader can't act on against the running total.
  if(c.active){
    const runProjects = state.data.filter(p=>projNeeds(p).run>0);
    const activeProjects = runProjects.length;
    // (#it6-p6a) singular-world phrasing: "N running across 1 active project" reads awkwardly — when the
    // running work is in a single project, say "N running in {project}" (or a bare "N running") instead.
    subBits.push(activeProjects===1
      ? `<b>${c.active} running</b> in ${esc(runProjects[0].name)}`
      : `<b>${c.active} running</b> across ${activeProjects} active projects`);
  }
  // sign-off count is owned by the lifted "Awaiting your sign-off" strip + its rail pill (#7) — not
  // restated here, so the same obligation number is not asserted three times above the fold.
  // (#it6-p5) the planned count is likewise single-sourced: the rail Planned pill + the Planned section
  // header own it, so it is NOT restated in the needs>0 subline (mirrors how sign-off is already kept out).
  if(maybe) subBits.push(maybe);
  const dc = deltaClause(c.needs);
  // (#it7-p6) suppress the trailing period when the delta clause follows — its own "·" separator
  // (CSS .delta::before) already divides it from the running bits, so "1 may be waiting. · Since…"
  // does not render a period jammed against the separator on the single most-read line.
  return `<div class="eyebrow">${day} · everything in one quiet view</div>
    <h1 class="headline"><em>${c.needs} ${c.needs===1?"thing needs":"things need"} you.</em> Everything else can wait.</h1>
    <p class="subline">${subBits.join(" · ")}${subBits.length&&!dc?".":""}${dc}</p>`;
}

/* ─────────────────────────── tally rail (jump-links) ─────────────────────────── */
function renderRail(c){
  // Needs-you count is owned solely by the hero (#1) — no needs pill here.
  // Hue + swatch only on the ACTIONABLE Sign-off pill — #2,#10. (No stalled-loop warning pill exists: a
  // stall verdict can't be grounded, carry-fwd #D.)
  // Counts are session-level except Healthy, whose unit is labelled (projects) so denominators are clear (#10).
  const pills=[]; // [extraCls, label, n, jumpId, hasSwatch]
  // No stalled-loop warning pill — stall/over-budget needs an iteration log pi can't ground (carry-fwd #D).
  // when nothing needs you, the calm hero already states the running/loop + merged-since counts — so the
  // Running and Merged rail pills drop their numbers (count lives in ONE place, #1); Sign-off keeps its
  // actionable count. They stay as jump-links.
  const calm = c.needs===0;
  // (#it5-p2) the Sign-off pill also drops its number when the hero owns the sign-off voice
  // (calm-with-sign-off): the obligation count then lives ONLY in the hero + the strip header (#1).
  if(c.sign)  pills.push(["sign","Sign-off", calm?"":c.sign, "sec-signoff", true]);
  if(c.active)pills.push(["","Running", calm?"":c.active, "sec-proj", false]);
  if(c.plan)  pills.push(["","Planned", c.plan, "sec-planned", false]);
  if(c.merge) pills.push(["","Merged", calm?"":c.merge, "sec-done", false]);
  if(c.healthy) pills.push(["",`Healthy · ${c.healthy} project${c.healthy>1?"s":""}`, "", "sec-healthy", false]);
  // (#it5-p3) only assert "Everything healthy — nothing needs you" when nothing actually needs you;
  // when needs>0 with no other pills the hero already owns the obligation, so leave the rail empty
  // rather than contradict the "N things need you" hero directly beneath it.
  if(!pills.length && c.needs===0) pills.push(["","Everything healthy — nothing needs you", "", "sec-proj", false]);
  document.getElementById("rail").innerHTML = pills.map(([cl,l,n,j,sw])=>
    `<button class="pill ${cl}" data-jump="${j}">${sw?'<span class="sw"></span>':""}${l}${n!==""?` <span class="n">${n}</span>`:""}</button>`).join("");
}

/* ─────────────────────────── needs you (4 bands, #14) ─────────────────────────── */
function needsSectionHtml(c){
  // When nothing needs you, the hero already says so exactly once — no header, no calmline restatement (#1).
  if(c.needs===0) return "";
  const focusBtn = c.needs>2 ? `<button class="hbtn" id="focusBtn">${focusIcon()} Triage all in focus</button>` : `<span class="hint">answer inline — your reply continues the conversation</span>`;
  // header carries NO count (hero owns it, #1); a single need gets a natural-width column, no empty sibling (#19)
  return `<div class="shead" id="sec-needs"><h2>Needs you</h2>${focusBtn}</div>
    <section class="needs${c.needs===1?' single':''}" id="needs"></section>`;
}
function renderNeeds(){
  const host=document.getElementById("needs"); if(!host) return;
  const items=[];
  Object.values(state.SESS).forEach(({s,w,p})=>{ if(isNeed(s)) items.push({s,w,p}); });
  // blast radius is the primary triage axis; ties break by AGE (oldest waiting first), then block-before-fail (#7),
  // then a DETERMINISTIC id tiebreaker (round-3 adv-fix C4): at N=200 backlog, blast+age+status routinely
  // tie across many items, and without a stable final key the order silently collapses toward iteration
  // order (which differs run-to-run as SESS rebuilds). The id sort makes the triage order reproducible so a
  // user re-finds the same blocked item #100 across renders.
  items.sort((a,b)=> blastRank(blastRadius(a.s))-blastRank(blastRadius(b.s))
    || (agoToMin(b.s.meta)-agoToMin(a.s.meta))
    || (a.s.status==="block"?0:1)-(b.s.status==="block"?0:1)
    || String(a.s.id).localeCompare(String(b.s.id)));
  const top = items.slice(0,2);
  const rest = items.slice(2);
  let html = top.map(({s,w,p})=>{
    const cls = s.status==="block" ? "block":"fail";
    const blast = blastRadius(s);
    const soft = s.status==="block" && !s.elicited;   // non-elicited stop — pi can't PROVE it's blocked (#9)
    // status badge + (optional) blast tag, both in the SAME hue so one card never shows two alarm colours (#16)
    const statusBadge = s.status==="fail" ? badge("fail") : badge("block", soft);
    const blastTag = (blast==="hi"||blast==="md") ? `<span class="blast ${cls}" title="Blast radius is a HEURISTIC triage hint — a manual override, a destructive-keyword scan of the last message, or a dirty-file-count bucket. It only ORDERS Needs-you; it gates nothing and is not a measured risk score.">${blastLabel(blast)}</span>` : "";
    // time-since-waiting (#7): the cards that most need triage context get the "how long has this blocked me" axis
    const wait = waitLabel(s);
    const waitTag = wait ? `<span class="waitage" title="time since the agent went idle waiting on you (from its last activity)">waiting ${wait}</span>` : "";
    const headTag = `${statusBadge} ${blastTag} ${waitTag}`;
    // chips ONLY when structurally elicited ({question,options[]}); else degrade to a single open (#9,#12)
    let chips="";
    if(s.elicited && s.chips && s.chips.length){
      chips = `<div class="qreply"><span class="qlbl">quick reply →</span>`+s.chips.map(q=>`<button data-reply="${s.id}" data-text="${esc(q)}">${esc(q)}</button>`).join("")+`</div>`;
    }
    const askHtml = soft
      ? `<span style="color:var(--muted)">No structured question — pi went idle (${esc(s.meta||'a while ago')}), unread. It may be waiting on you, or may simply have finished. Open to read its last message.</span>`
      : esc(s.live);
    // (round-2 adv-fix) the PRIMARY verb follows the card's situation:
    //  · FAILED → the specific remedy (Re-authenticate / Re-run) is the primary action; "Open conversation"
    //    demotes to a ghost secondary. "Continue the conversation" is the wrong verb on a dead job.
    //  · BLOCK (elicited) → "Continue the conversation" stays primary — answering genuinely IS continuing,
    //    and the chips above prefill the composer.
    //  · soft idle stop → "Open conversation" (pi can't prove it's blocked, so no "continue" promise).
    let actions;
    if(s.status==="fail"){
      const remedy = esc(s.failAction||"Re-run");
      actions = `<button class="btn primary" data-open="${s.id}">${continueIcon()} ${remedy}</button>
        <button class="btn ghost sm" data-open="${s.id}">Open conversation</button>`;
    } else {
      actions = `<button class="btn primary" data-open="${s.id}">${continueIcon()} ${soft?"Open conversation":"Continue the conversation"}</button>`;
    }
    return `<article class="need ${cls}">
      <div class="crumb"><b>${esc(p.name)}</b> &nbsp;›&nbsp; ${esc(w.name)}</div>
      <div class="sname"><span class="nm">${esc(s.name)}</span> ${headTag}</div>
      <div class="ask">${askHtml}</div>
      ${chips}
      <div class="actions">
        ${actions}
      </div>
    </article>`;
  }).join("");
  if(rest.length){
    const needRow = ({s,w,p})=>{
      const blast=blastRadius(s);
      const blastTag = (blast==="hi"||blast==="md")?`<span class="blast ${s.status==='fail'?'fail':'block'}" title="Blast radius is a HEURISTIC triage hint (manual override / destructive-keyword scan / dirty-file-count bucket). It only orders Needs-you; it gates nothing.">${blast==="hi"?"high":"elevated"}</span>`:"";
      const wait=waitLabel(s); const waitTag = wait?`<span class="waitage">waiting ${wait}</span>`:"";
      // (round-2 adv-fix) carry the quick-reply CHIPS into the overflow row so "answer IS continue"
      // (invariant #4) holds for the tail too — every elicited blocked item stays ONE click from an
      // inline answer, not just the top 2. Without this, items 3+ degraded to a bare Continue.
      const rowChips = (s.elicited && s.chips && s.chips.length)
        ? `<div class="qreply rowqreply"><span class="qlbl">quick reply →</span>`+s.chips.map(q=>`<button data-reply="${s.id}" data-text="${esc(q)}">${esc(q)}</button>`).join("")+`</div>`
        : "";
      // a FAILED tail item gets its specific remedy as the row action; a block item keeps "Continue".
      const rowBtn = s.status==="fail"
        ? `<button class="btn primary sm" data-open="${s.id}">${continueIcon()} ${esc(s.failAction||"Re-run")}</button>`
        : `<button class="btn primary sm" data-open="${s.id}">${continueIcon()} Continue</button>`;
      // (round-3 adv-fix C4) each overflow row carries a stable id + a lowercase searchable haystack
      // (project · workstream · item · live) so the "jump to item" filter can reach blocked item #100 in a
      // large backlog without scrolling 198 rows.
      const hay = esc(`${p.name} ${w.name} ${s.name} ${s.live||""}`.toLowerCase());
      return `<div class="needrow" id="needrow-${esc(s.id)}" data-needfilter="${hay}">
        <span class="sess-dot ${(ST[s.status]||{}).cls||'idle'}" style="background:${(ST[s.status]||{}).color}"></span>
        <div class="nleft">
          <div class="ncrumb"><b>${esc(p.name)}</b> › ${esc(w.name)} ${blastTag}${waitTag}</div>
          <div class="nq">${esc(s.live)}</div>
          ${rowChips}
        </div>
        ${rowBtn}
      </div>`;
    };
    const RCAP=6, rShown=rest.slice(0,RCAP), rExtra=rest.slice(RCAP);   // cap the reveal too (#9)
    // (round-3 adv-fix C4) at a large backlog the capped reveal alone can't reach a deep item — add a
    // "jump to item" filter that narrows the overflow to matching rows (it auto-reveals the hidden tail so
    // even item #100 is reachable). Gated on a threshold so a small backlog stays calm and uncluttered.
    const JUMP_MIN = 8;
    const jumpBox = rest.length>=JUMP_MIN
      ? `<input class="needjump" type="search" placeholder="jump to item — filter ${rest.length} by project / workstream / name" aria-label="jump to a blocked item" oninput="filterNeeds(this)">`
      : "";
    html += `<div class="needmore" id="needmore" style="grid-column:1/-1">
      <div class="needmore-h" data-toggle="needmore"><b>+${rest.length} more need you</b> — collapsed to stay calm; ordered by blast radius, then waiting time<span class="chev">${chevIcon()}</span></div>
      <div class="needmore-b">${jumpBox}<div class="needjump-empty" hidden>No matching item.</div>${rShown.map(needRow).join("")}${rExtra.length?`<div class="more-rows" hidden>${rExtra.map(needRow).join("")}</div><button class="morelink" data-toggle="more">+${rExtra.length} more — show all</button>`:""}</div>
    </div>`;
  }
  host.innerHTML = html;
}
/* (round-3 adv-fix C4) "jump to item" — filter the Needs-you overflow so a deep blocked item in a large
   backlog is reachable without scrolling. While a query is active the hidden tail (the +N more-rows block)
   is force-shown so EVERY matching row surfaces, not just the first capped page; clearing the box restores
   the calm capped state. Pure client-side text match against the row's data-needfilter haystack. */
function filterNeeds(inp){
  const wrap = inp.closest(".needmore-b"); if(!wrap) return;
  const q = String(inp.value||"").trim().toLowerCase();
  const tail = wrap.querySelector(".more-rows");
  const moreBtn = wrap.querySelector(".morelink");
  const empty = wrap.querySelector(".needjump-empty");
  const rows = Array.from(wrap.querySelectorAll(".needrow"));
  if(q){ if(tail) tail.hidden=false; if(moreBtn) moreBtn.style.display="none"; }
  else { if(moreBtn) moreBtn.style.display=""; }
  let shown=0;
  rows.forEach(r=>{ const hit = !q || (r.getAttribute("data-needfilter")||"").includes(q); r.style.display = hit?"":"none"; if(hit) shown++; });
  // when the query is cleared, re-hide the tail rows so the overflow returns to its capped resting state
  if(!q && tail){ tail.hidden=true; tail.querySelectorAll(".needrow").forEach(r=>{ r.style.display=""; }); }
  if(empty) empty.hidden = !(q && shown===0);
}

/* ─────────────────────────── sign-off — first-class to-do LIST (#1,#4,#5,#6) ─────────────────────────── */
function hasGitBranch(s){ return !!(s.artifact && s.artifact.branch && s.artifact.kind!=="doc"); }  // gate merge on a real branch (#4)
function branchOf(s){ return (s.artifact&&s.artifact.branch)||""; }
function signoffSectionHtml(c){
  if(!c.sign) return "";
  // first-class, lifted directly under Needs-you — but ~1/3 the visual mass of a card band (#1)
  const batch = c.sign>1
    ? `<button class="hbtn sgn" id="signAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="13" height="13"><path d="M20 6 9 17l-5-5"/></svg> Sign off all ${c.sign}</button>`
    : `<span class="hint">one click — no reply needed</span>`;
  // (#it6-p4) single-source the count: when c.sign>1 the "Sign off all N" button ~2cm away already carries
  // the number, so the "N done" cnt pill is dropped. It stays only in the single-item case (button has no count).
  const cnt = c.sign>1 ? "" : `<span class="cnt">${c.sign} done</span>`;
  return `<div class="shead" id="sec-signoff"><h2>Awaiting your sign-off</h2>${cnt}${batch}</div>
    <section class="signoff" id="signoffHost"></section>`;
}
function mergeAffordance(s){
  // a real branch → an unambiguous "ask pi to merge" prompt; otherwise NO merge implied (#4)
  return hasGitBranch(s)
    ? `<button class="btn ghost sm" data-open="${s.id}">Ask pi to merge ${esc(branchOf(s))} → main</button><span class="infg" title="Merge is a SEPARATE, net-new step — pi's git layer is local-only (no push/PR/merge). This sends the agent the prompt &quot;merge ${esc(branchOf(s))} into main&quot; via /api/prompt, or a net-new git-merge endpoint.">i</span>`
    : `<button class="btn ghost sm" data-open="${s.id}">Archive</button>`;
}
function renderSignoff(){
  const host=document.getElementById("signoffHost"); if(!host) return;
  const items=[]; Object.values(state.SESS).forEach(({s,w,p})=>{ if(s.status==="sign") items.push({s,w,p}); });
  const CAP=3, shown=items.slice(0,CAP), rest=items.slice(CAP);
  const rowHtml = ({s,w,p}) => {
    const gate=s._gate, gone=!!state.signed[s.id], pending=signPending(s);
    const lineage = p.nest?` <span class="nest" title="own project root nested inside its parent — not counted toward the parent">⤷ ${esc(p.nest)}</span>`:"";
    const crit = pending
      ? `<span class="pend">Done — pending recheck</span> · ${esc((gate&&gate.text)||s.dod)} ${srcTag(s.dodSrc)}`
      : `Done per its DoD — <span class="gk">${esc((gate&&gate.text)||s.dod)}</span> ${srcTag(s.dodSrc)}`;
    const act = gone
      ? `<span style="color:var(--st-merge);font-weight:650">✓ Signed off</span>${mergeAffordance(s)}`
      : pending
        ? `<button class="btn primary sm" data-recheckcard="${s.id}" title="command DoD evidence is older than ~1h (stale) — re-run it on demand so the ring can promote instead of resting on stale evidence (#C7)">${recheckIcon()} Re-check</button><button class="btn ghost sm" data-open="${s.id}">Review</button>`
        : `<button class="btn sign" data-signoff="${s.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg> Sign off</button><button class="btn ghost sm" data-open="${s.id}">Review</button>`;
    return `<article class="soff ${gone?'gone':''}">
      <div class="sleft">
        <div class="scrumb"><b>${esc(p.name)}</b>${lineage} › ${esc(w.name)} · <span class="sn">${esc(s.name)}</span></div>
        <div class="scrit">${crit}${s.artifact?` <span style="opacity:.45">·</span> ${artChip(s)}`:""}</div>
      </div>
      <div class="sact">${act}</div>
    </article>`;
  };
  let html = shown.map(rowHtml).join("");
  if(rest.length){
    html += `<div class="needmore" id="signmore"><div class="needmore-h" data-toggle="needmore"><b>+${rest.length} more to sign off</b> — collapsed to keep the fold tight<span class="chev">${chevIcon()}</span></div>
      <div class="needmore-b">${rest.map(rowHtml).join("")}</div></div>`;
  }
  host.innerHTML = html;
}
function showToast(msg, undoFn){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${msg}</span>`+(undoFn?`<button class="undo" id="toastUndo">Undo</button>`:"");
  t.classList.add("show");
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove("show"), 5200);
  const u=document.getElementById("toastUndo"); if(u) u.onclick=()=>{ if(undoFn) undoFn(); t.classList.remove("show"); };
}
/* one-click sign-off = PATCH the manual gate criterion met=true (optimistic) + undo toast (#6) */
function signOff(id){
  const ref=state.SESS[id]; if(!ref) return;
  const gate=ref.s._gate;
  state.signed[id]=true; if(gate) gate.met=true;
  renderSignoff();
  showToast(`<b>${esc(ref.s.name)}</b> signed off — merge is a separate step.`, ()=>{ state.signed[id]=false; if(gate) gate.met=false; renderSignoff(); });
}
/* batch action (#1): sign off every clean (non-pending) item at once, one undo */
function signOffAll(){
  const flipped=[];
  Object.values(state.SESS).forEach(({s})=>{ if(s.status==="sign" && !signPending(s) && !state.signed[s.id]){ state.signed[s.id]=true; if(s._gate) s._gate.met=true; flipped.push(s); } });
  renderSignoff();
  showToast(`<b>${flipped.length}</b> signed off — merges are separate steps.`, ()=>{ flipped.forEach(s=>{ state.signed[s.id]=false; if(s._gate) s._gate.met=false; }); renderSignoff(); });
}
/* on-demand re-check of a stale/unrun command DoD (#5): neutral evaluating ring, then a fresh eval */
function recheckCard(id){
  const ref=state.SESS[id]; if(!ref) return; const s=ref.s;
  s._evaluating=true; renderGrid();
  showToast(`Re-checking <b>${esc(s.name)}</b>… (on-demand command DoD via /api/dod/evaluate)`);
  setTimeout(()=>{ (s.crit||[]).forEach(c=>{ if(c.src==="command" && !c.gate){ c.met=true; c.at="now"; } }); s._prog=computeProgress(s.crit); s._evaluating=false; renderSignoff(); renderGrid(); }, 850);
}

/* ─────────────────────────── projects ─────────────────────────── */
function projectsSectionHtml(c){
  // section head = title + count only; the ring legend moved into a '?' tip (#20c)
  return `<div class="shead" id="sec-proj"><h2>Projects</h2><span class="cnt">${state.data.length}</span>
      <span class="hint">tap a card to drill in <span class="infg" title="Each ring is one workstream. Segments = its Definition-of-Done criteria, filled = met (or 'k of n sessions done' when a workstream's sessions use mixed DoD sources). ✓ = merged · ∞ = autonomous loop · ? = no DoD set yet.">?</span></span>
    </div>
    <section id="projectsHost"></section>`;
}
// a loop NEVER warns on the live view (stall/over-budget can't be grounded, carry-fwd #D), so there is
// no "stalled project" to float to the top — kept as a stable false so the active-card order is by data only.
function projWarn(p){ return false; }
/* a project is "fully surfaced in Needs-you" only when EVERY session of EVERY workstream is itself a
   need (block/fail) — session-level, not the workstream's rolled-up status. This keeps the blocked-
   scenario grid-collapse, but stops a mixed-source workstream (run/block/sign/unset/loop sessions)
   from being treated as fully surfaced, so its full card renders and its honest k-of-n gauge shows (#4). */
function allWsSurfaced(p){ return p.workstreams.length>0 && p.workstreams.every(w=>(w.sessions||[]).length>0 && w.sessions.every(s=>s.status==="block"||s.status==="fail")); }
function agoToMin(a){
  const s=String(a||"").toLowerCase(); const m=s.match(/(\d+(?:\.\d+)?)/); const v=m?parseFloat(m[1]):1;
  if(/yesterday/.test(s)) return 1440;
  if(/min|m ago/.test(s)) return v;
  if(/h ago|hour/.test(s)) return v*60;
  if(/d ago|day/.test(s)) return v*1440;
  if(/w ago|week/.test(s)) return v*10080;
  return 1e9;
}
function mergeRecency(p){ let best=1e9; p.workstreams.forEach(w=>w.sessions.forEach(s=>{ const a=(s.artifact&&s.artifact.mergedAgo)||w.mergedAgo; if(a){ const n=agoToMin(a); if(n<best) best=n; } })); return best; }

/* attention-driven, ALWAYS: full ring-cards for attn (always) + capped active (#2); sign-off / dormant
   collapse to rows; when every attn/active card is fully surfaced in Needs-you, collapse the grid (#11). */
function renderGrid(){
  const host=document.getElementById("projectsHost"); if(!host) return;
  const attn = state.data.filter(p=>pClass(p)==="attn");
  const active = state.data.filter(p=>pClass(p)==="active"); // no "stalled loops first" — a loop never alarms on the live view (#D)
  const dormant = state.data.filter(p=>pClass(p)==="calm");
  let signoff = state.data.filter(p=>pClass(p)==="signoff");

  // never an empty grid: promote sign-off projects to full cards when nothing is attn/active
  let fullSign=[];
  if(!attn.length && !active.length && signoff.length){ fullSign = signoff.slice(); signoff = []; }

  const fullCandidates = attn.concat(active);
  // #11: collapse the whole grid to one line when every attn/active card is fully surfaced in Needs-you
  const allCollapse = fullCandidates.length>0 && fullCandidates.every(allWsSurfaced) && !active.some(projWarn);

  let out="";
  if(allCollapse){
    out += `<div class="surfline" style="border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-bottom:14px">
      <span class="sq"></span><b>All work across ${fullCandidates.length} project${fullCandidates.length>1?"s":""}</b> is in Needs&nbsp;you above — nothing extra to surface here
      <button class="jump" data-jump="sec-needs">answer ↑</button></div>
      <div class="grpcard" id="sec-collapsed"><div class="grp-h" data-toggle="grp"><span class="gt">In Needs you</span> <span class="gc">${fullCandidates.length} project${fullCandidates.length>1?"s":""} · drill in for full context</span><span class="chev">${chevIcon()}</span></div>
        <div class="grp-b">`+fullCandidates.map(p=>renderRow(p)).join("")+`</div></div>`;
  } else {
    // (round-3 adv-fix C3) cap ATTN full-cards too — a correlated-failure surge (every project blocked at
    // once, e.g. one dependency stops N sub-agents) must NOT paint one full ring-card per blocked project,
    // or the grid becomes the instrument-panel wall invariant #6 forbids "at ANY scale". The first N render
    // as full cards (sorted so the highest-blast attn projects keep their rich card); the rest fold into a
    // grouped "N more need attention" overflow row that points up to Needs-you, mirroring activeOverflow.
    const ATTN_CAP = 4;
    const attnSorted = attn.slice().sort((a,b)=> blastRank(cardBlast(a))-blastRank(cardBlast(b)));
    const attnFull = attnSorted.slice(0, ATTN_CAP);
    const attnOverflow = attnSorted.slice(attnFull.length);
    const ACTIVE_CAP = 4;   // cap ACTIVE full-cards too (carry-fwd #F) — overflow folds into "Running · N more"
    const activeFull = active.slice(0, ACTIVE_CAP);
    const activeOverflow = active.slice(activeFull.length);
    const full = attnFull.concat(activeFull).concat(fullSign);
    const single = full.length===1 && !signoff.length && !dormant.length && !activeOverflow.length && !attnOverflow.length;
    if(full.length) out += `<div class="grid ${single?'single':''}">`+full.map(p=>renderCard(p)).join("")+`</div>`;
    // (C3) fold attn overflow into a "Needs attention · N more" grouped-row card. Windowing (#9 more-rows
    // cap) keeps even a fleet-wide block from rendering an unbounded row list — overflow tail folds again
    // behind "+N more — show all". Each row still NAMES its blocker and jumps up to Needs you (invariant #4).
    if(attnOverflow.length){
      const AOC=6, aoShown=attnOverflow.slice(0,AOC), aoExtra=attnOverflow.slice(AOC);
      out += `<div class="grpcard" id="sec-attn-more"><div class="grp-h" data-toggle="grp"><span class="gt">Needs attention</span> <span class="gc">${attnOverflow.length} more need attention · answer in Needs you above</span><button class="jump" data-jump="sec-needs">answer ↑</button><span class="chev">${chevIcon()}</span></div>
        <div class="grp-b">`+aoShown.map(p=>renderRow(p)).join("")
          +(aoExtra.length?`<div class="more-rows" hidden>${aoExtra.map(p=>renderRow(p)).join("")}</div><button class="morelink" data-toggle="more">+${aoExtra.length} more — show all</button>`:"")
        +`</div></div>`;
    }
    // #2: fold active overflow into a "Running · N more" grouped-row card (name + dot-strip + live one-liner)
    if(activeOverflow.length){
      out += `<div class="grpcard" id="sec-running"><div class="grp-h" data-toggle="grp"><span class="gt">Running</span> <span class="gc">${activeOverflow.length} more loop${activeOverflow.length>1?"s":""} · live · nothing needs you</span><span class="chev">${chevIcon()}</span></div>
        <div class="grp-b">`+activeOverflow.map(p=>renderRow(p,{live:true})).join("")+`</div></div>`;
    }
  }
  // (#it6-p1) every COUNTED project must have a navigable home in the grid. When attn/active cards
  // exist, the non-promoted sign-off projects (e.g. ai-education in default) were filtered out of the
  // grid entirely while the "Projects N" header still counted them — a count-reconciliation failure.
  // Fix: render them as collapsed NAVIGATE-ONLY rows in a small "Awaiting sign-off" group. These rows
  // drill in via the chevron / Review-and-open path only; the sign-off ACTION stays solely in the lifted
  // strip above (carry-fwd #B: no second action-surface), so this reconciles the count without a
  // duplicate action heading.
  if(signoff.length){
    out += `<div class="grpcard" id="sec-signoff-grid"><div class="grp-h" data-toggle="grp"><span class="gt">Awaiting sign-off</span> <span class="gc">${signoff.length} project${signoff.length>1?"s":""} · sign off in the strip above · drill in to review</span><button class="jump" data-jump="sec-signoff">sign off ↑</button><span class="chev">${chevIcon()}</span></div>
      <div class="grp-b">`+signoff.map(p=>renderRow(p,{navOnly:true})).join("")+`</div></div>`;
  }
  // carry-fwd #B: NO second "Awaiting your sign-off" ACTION surface in the grid. The lifted strip above
  // (signoffHost / #sec-signoff) is the ONE canonical sign-off action surface — its rows carry the
  // Sign-off button. The grid group above is NAVIGATE-ONLY (rows expand / Review), so the project still
  // has a home in the grid and the count reconciles, without duplicating the sign-off action.
  // dormant group — recency-sorted + capped with show-all (#9); id=sec-healthy for the rail jump (#10)
  if(dormant.length){
    const sorted = dormant.slice().sort((a,b)=> mergeRecency(a)-mergeRecency(b));
    const CAP=6, shown=sorted.slice(0,CAP), extra=sorted.slice(CAP);
    out += `<div class="grpcard" id="sec-healthy"><div class="grp-h" data-toggle="grp"><span class="gt">Healthy &amp; dormant</span> <span class="gc">${dormant.length} project${dormant.length>1?"s":""} · nothing needs you · last-known cached status</span><span class="chev">${chevIcon()}</span></div>
      <div class="grp-b">`+shown.map(p=>renderRow(p)).join("")
        +(extra.length?`<div class="more-rows" hidden>${extra.map(p=>renderRow(p)).join("")}</div><button class="morelink" data-toggle="more">+${extra.length} more — show all</button>`:"")
      +`</div></div>`;
  }
  host.innerHTML = out;
}

/* cap the opened workstream list at ~6 so even an 8-workstream project never becomes an instrument
   wall (invariant #6, #9e); the rest fold behind "+N more workstreams" (reuses data-toggle=more). */
function renderWsList(p, opts){
  const all = p.workstreams.slice().sort(byAttention);
  const CAP=6, shown=all.slice(0,CAP), more=all.slice(CAP);
  return shown.map(w=>renderWorkstream(w,p,opts)).join("")
    + (more.length ? `<div class="more-rows" hidden>${more.map(w=>renderWorkstream(w,p,opts)).join("")}</div><button class="morelink" data-toggle="more">+${more.length} more workstream${more.length>1?"s":""}</button>` : "");
}

function renderCard(p){
  const c = projNeeds(p);
  const live = cardLive(p);
  const hasNeeds = (c.you||c.fail) > 0;
  const countPills = [];
  // Needs-you count is owned by the hero (#1) — NO per-card "N in Needs you" pill. The one-liner names
  // the blocker and points up; the dot-strip shows the blocked workstream as an amber square (carry-fwd #G).
  if(c.sign){ countPills.push(`<button class="countpill sgn jumplink" data-jump="sec-signoff">${c.sign} to sign off ↑</button>`); }
  if(!hasNeeds && !c.sign){ countPills.push(c.run?`<span class="countpill calm">${c.run} running</span>`:`<span class="countpill calm">all calm</span>`); }

  // collapsed face = ONE muted project gauge (k of n workstreams done) + a shape-coded dot-strip + the
  // NAMED long pole (carry-fwd #C). No ring-per-workstream wall at any scale; rich per-criterion rings
  // live on the opened workstream only. No salient amber alarm here (carry-fwd #G) — the one-liner already
  // names the blocker, so attention never inverts onto the quietest ring cell.
  const g = projGauge(p);
  const pole = longPole(p);
  // a project whose only workstreams are open-ended loops has no terminal DoD to gauge (#9a) — show the
  // running ∞ instead of a meaningless "0 of 0", and skip the long-pole line entirely.
  const allOpenEnded = g.total===0;
  const gaugeItem = allOpenEnded ? { status:"loop", loop:true } : { status:"gauge", _sessGauge:{done:g.done, total:g.total, percent:g.percent} };
  // #9a: when the long pole is itself surfaced in Needs-you, salience lives ONCE — mute its status to a
  // quiet "in Needs you ↑" jump instead of repeating an amber alarm on the otherwise-calm card face.
  const poleInNeeds = pole && (pole.status==="block"||pole.status==="fail");
  const poleTag = poleInNeeds
    ? `<button class="muted-jump" data-jump="sec-needs">· in Needs you ↑</button>`
    : (pole?badge(pole.status):"");
  // (#it6-p2) the gauge caption is now PURELY about DoD progress. The earlier "· N pending sign-off"
  // clause here was workstream-grain while the countPill "${c.sign} to sign off ↑" is session-grain; they
  // share the bare "sign off" label and diverge at dense scale (9 sessions vs 2 workstreams), reading as
  // rival counts. The sign-off obligation now lives in exactly ONE voice (the pill + the lifted strip,
  // invariant #1), so pendTxt is dropped from the caption entirely.
  // (#it5-p5b) open-ended loop workstreams are dropped from the gauge DENOMINATOR but still show as
  // cyan dots in the strip — so a bare "1 of 1 met DoD" silently disagrees with a 2-dot strip. Name the
  // denominator ("scoped workstream") and append an explicit "· N loop running" clause so the count
  // reconciles with the dots.
  const loopWs = p.workstreams.filter(wsOpenEnded).length;
  const loopClause = loopWs?` · <b>${loopWs} loop${loopWs>1?"s":""} running</b>`:"";
  const scopedWord = loopWs?`scoped workstream${g.total>1?"s":""}`:`workstream${g.total>1?"s":""}`;
  const poleLine = allOpenEnded
    ? `<div class="csum-pole"><span class="plbl">Continuous loop — no terminal Definition of Done.</span></div>`
    : pole && !wsDone(pole)
      ? `<div class="csum-pole"><span class="plbl">Long pole:</span> <b>${esc(shortWs(pole.name))}</b> ${poleTag}</div>`
      // (#it5-p5a) all scoped workstreams met DoD: the gauge line already states this — drop the
      // verbatim-redundant "All workstreams have met their Definition of Done" prose pole line.
      : ``;
  const gaugeLine = allOpenEnded
    ? `<div class="csum-line"><b>∞ looping</b> · open-ended ${dotStrip(p)}</div>`
    : `<div class="csum-line"><b>${g.done} of ${g.total}</b> ${scopedWord} met DoD${loopClause} ${dotStrip(p)}</div>`;
  const ringsBlock = `<div class="csum">
    <div class="csum-ring" title="${allOpenEnded?'an open-ended loop has no terminal DoD to be k-of-n against — shown as running ∞':'k of '+g.total+' workstreams have met their Definition of Done — an honest aggregate, not an authored percent'}">${ringSvg(gaugeItem, 50)}</div>
    <div class="csum-body">
      ${gaugeLine}
      ${poleLine}
    </div>
  </div>`;

  const ws = renderWsList(p);
  // one-liner: point UP when the only live item is a surfaced need / a sign-off (#11) — never a redundant Continue
  const liveRun = (live.tone==="run"||live.tone==="loop");
  let olActs, olAttr, ping="";
  if(live.pointUp){
    const lbl = live.pointUp==="sec-needs" ? "Answer ↑" : "Sign off ↑";
    olActs = `<button class="btn ghost sm" data-jump="${live.pointUp}">${lbl}</button>`;
    olAttr = `data-jump="${live.pointUp}"`;
  } else {
    olActs = live.id
      ? `<button class="btn primary sm" data-open="${live.id}">${continueIcon()} ${liveRun?"Open":"Continue"}</button>`
      : "";
    olAttr = live.id?`data-open="${live.id}"`:"";
    ping = (live.id && live.id===state._pingId) ? " ping" : "";
  }

  return `<article class="pcard" id="card-${p.id}" data-p="${p.id}">
    <div class="pcard-head" data-toggle="card">
      <div class="pcard-id">
        <div class="pname"><span class="nm">${esc(p.name)}</span> ${p.nest?`<span class="nest" title="own project root nested inside its parent — its work is NOT counted toward the parent">⤷ ${esc(p.nest)}</span>`:""}</div>
        <div class="ppath mono">${esc(p.path)}${p.desc?` · ${esc(p.desc)}`:""}</div>
      </div>
      <div class="pcard-counts">
        <span class="chev">${chevIcon()}</span>
        ${countPills.join("")}
      </div>
    </div>
    ${ringsBlock}
    <div class="oneliner ${live.tone}${ping}" ${olAttr}>
      <span class="live"></span>
      <span class="txt">${live.loop?`<b>loop · </b>`:""}${esc(live.txt)}</span>
      ${live.qDelta?`<span class="qdelta" title="~${live.qDelta.total} items in the loop's planned queue — best-effort parsed from the agent's notes (pi has no plan primitive, so the count is approximate). Queue growth is EXPECTED for an open-ended loop and never an alarm.">~${live.qDelta.total} queued</span>`:""}
      ${olActs?`<span class="ol-act">${olActs}</span>`:""}
    </div>
    <div class="pbody">${ws}</div>
  </article>`;
}

/* compact dense row — name + shape-coded dot-strip + tiny summary (or the LIVE one-liner for the
   "Running · N more" overflow group, #2), expands inline. */
function renderRow(p, opts){
  const o=opts||{};
  const c=projNeeds(p);
  const lv = o.live ? cardLive(p) : null;
  let sum;
  if(o.live) sum = `<span style="color:var(--st-run)">${lv.loop?'∞ ':''}live</span>`;
  else if(c.you||c.fail) sum=`<b>${c.you+c.fail}</b> need you`;   // #11: a surfaced row reads "needs you", never "healthy"
  else if(c.sign) sum=`<b>${c.sign}</b> to sign off`;
  else { const merged=p.workstreams.filter(w=>w.status==="merge").length; const q=p.workstreams.filter(w=>w.status==="queued"||w.status==="planned").length;
    sum = merged?`<b>${merged}</b> merged`+(q?` · ${q} queued`:""):(q?`<b>${q}</b> queued`:"healthy"); }
  const ppTxt = o.live ? esc(lv.txt) : esc(p.path);
  const ppCls = o.live ? "pp" : "pp mono";
  const ws = renderWsList(p, {navOnly:o.navOnly});
  return `<div class="prow" id="card-${p.id}" data-toggle="prow" data-rowp="${p.id}">
      ${dotStrip(p)}
      <span class="pn">${esc(p.name)}${p.nest?` <span class="nest" title="nested under its parent — counted only here, not toward the parent">⤷ ${esc(p.nest)}</span>`:""}</span>
      <span class="${ppCls}">${ppTxt}</span>
      <span class="psum">${sum}</span>
      <span class="chev">${chevIcon()}</span>
    </div>
    <div class="prow-body" data-rowbody="${p.id}"><div class="pbody" style="display:block;border-top:0">${ws}</div></div>`;
}

function renderWorkstream(w,p,opts){
  let extra="";
  if(w.status==="loop"){
    extra = `<span class="loopBadge"><span class="inf">∞</span> looping ${esc(fmtMin(wsLoopMinutes(w)))}</span>`;
  } else extra = badge(w.status);
  // session-list cap (#20d): only the first 6 (by attention) render; the rest fold behind "+N more"
  const sorted = w.sessions.slice().sort(byAttention);
  const CAP=6, shown=sorted.slice(0,CAP), more=sorted.slice(CAP);
  const sess = shown.map(s=>renderSession(s,w,p,opts)).join("")
    + (more.length ? `<div class="sess-extra" hidden>${more.map(s=>renderSession(s,w,p,opts)).join("")}</div><button class="sessmore" data-toggle="sessmore">+${more.length} more session${more.length>1?"s":""}</button>` : "");
  // mixed-source workstreams report "k of n sessions done", never a blended percent (#5)
  const mixedNote = w._mixed ? ` <span class="srcTag" title="this workstream's sessions use different DoD evaluators (git / command / manual / sign-off), so the ring is a 'k of n sessions done' gauge — not a blended percent">mixed sources · ${w._sessGauge.done}/${w._sessGauge.total} done</span>` : "";
  const wsDod = (w.status==="unset"
    ? `<span style="color:var(--st-sign)">not set</span> ${srcTag(w.dodSrc)}`
    : dodInline(w.dod, w.dodSrc)) + mixedNote;
  return `<div class="ws" data-w="${w.id}">
    <div class="ws-head" data-toggle="ws">
      <div class="ws-ring">${ringSvg(w, 44)}</div>
      <div class="ws-id">
        <div class="ws-name">${esc(w.name)} ${extra}</div>
        <div class="ws-dod">${wsDod}</div>
      </div>
      <div class="ws-meta">
        <span class="ws-cnt">${w.sessions.length} session${w.sessions.length>1?"s":""}</span>
        <span class="ws-chev chev">${chevIcon()}</span>
      </div>
    </div>
    <div class="sess-list">${sess}</div>
  </div>`;
}

/* artifact chip FACE carries only the receipt's identity — branch/sha + diff, or doc name.
   The command/exit/timestamp/re-check evidence lives once in the DoD criteria list in the drawer (#14). */
function artChip(s){
  const a=s.artifact; if(!a) return "";
  if(a.kind==="doc"){
    // gate-aware (#19): "awaiting your review" while the manual review gate is unmet; "✓ user-reviewed" after
    const gate=s._gate; const reviewed = !gate || gate.met || state.signed[s.id];
    const tag = reviewed ? `<span class="ok">✓ user-reviewed</span>` : `<span style="color:var(--muted)">awaiting your review</span>`;
    // #13: the file count is derived from the session's own write/edit tool_result entries (no git, no PR)
    return `<span class="artchip doc" title="No repo — file count derived from this session's write/edit tool_result entries; verification is your review of the rendered notes, not a merge.">📄 ${esc(a.note)} · ${a.files} file${a.files>1?"s":""} · ${tag}</span>`;
  }
  const merged = a.merged;
  const diff = `<span class="add">+${a.add}</span>/<span class="del">−${a.del}</span>`;
  const head = merged ? `✓ merged · ${esc(a.sha)}` : esc(a.branch);
  return `<span class="artchip ${merged?'mg':''}">${esc(head)} · ${diff}</span>`;
}

/* loop iteration telemetry rendered as an explicit PROPOSED signal (carry-fwd #D): muted, dashed, labelled
   "proposed", never live. Iteration count + rhythm sparkline + budget cap + stall detection all need a
   durable per-iteration log (CustomEntry 'pi-web:loop-iter') + an orchestrator pi does not expose today. */
function proposedLoop(s){
  const parts=[];
  if(s.iter!=null) parts.push(`<b>iter ${s.iter}</b>`);
  if(s.iterspark && s.iterspark.length) parts.push(iterSparkHtml(s.iterspark));
  const b=(s.budget)||{};
  if(b.maxMinutes!=null && s.elapsedMin!=null) parts.push(`budget ${s.elapsedMin}/${b.maxMinutes}m`);
  else if(b.maxCostUsd!=null && s.cost!=null) parts.push(`budget $${s.cost}/$${b.maxCostUsd}`);
  // NO stall / over-budget reason appended — a stall verdict can't be grounded (no iteration log), so even
  // inside the muted proposed band we never assert "stalled" / "over budget" as if it were derived telemetry.
  const body = parts.length ? parts.join(" · ")+" — not live yet" : "iteration count, rhythm & budget — not live yet";
  return `<div class="proposed" title="Loop iteration telemetry (count, rhythm sparkline, budget cap, stall detection) needs a durable per-iteration log (CustomEntry 'pi-web:loop-iter') + an orchestrator pi does NOT expose today. Shown MUTED as a proposed signal — never live data. The live badge above ('∞ looping {elapsed}') is grounded in the stored loopStartedAt.">
    <span class="plab">proposed</span><span class="pbody">${body}</span></div>`;
}
function renderSession(s,w,p,opts){
  const navOnly = !!(opts&&opts.navOnly);  // (#it6-p1) sign-off grid rows are navigate-only — no inline Sign-off action
  const cls=(ST[s.status]||{}).cls||"idle";
  // shape-coded sess-dot encodes status without leaning on hue (#14); status badge dropped (ws badge sits above)
  const dot = `<span class="sess-dot ${cls}" style="background:${(ST[s.status]||{}).color||'var(--st-idle)'}"></span>`;
  const artifact = s.artifact ? `<div style="margin-top:8px">${artChip(s)}</div>` : "";
  let queue="";
  if(s.queue && s.queue.length){
    const total = s.queueTotal || s.queue.length;
    const shown = s.queue.slice(0,3);
    const more = total - shown.length;
    queue = `<div class="qnext"><span class="qsrc" title="pi has no TodoWrite/plan primitive — these items are best-effort parsed from the agent's notes, so the count is approximate (~).">~ parsed from notes →</span>`
      // (#it5-p7f) no ordinal number on the chips — these are hedged (~) best-effort items with no
      // grounded ordering, so a confident "1 · 2 · 3" would over-assert a sequence pi can't provide.
      +shown.map(q=>`<span class="qchip">${esc(q)}</span>`).join("")
      +(more>0?`<span class="qmore">~${more} more planned</span>`:"")
      +`<span class="infg" title="Planned-next items are best-effort, parsed from the agent's notes — pi has no TodoWrite/plan primitive, so the count is approximate (~). A plan-tool extension writing CustomEntry items would make it exact.">i</span></div>`;
  }
  // state-matched verbs (#20e); sign rows expose the same one-click Sign off as the strip (#6)
  // (#it6-p1) in a NAVIGATE-ONLY sign-off grid row, a sign session opens to "Review" instead of carrying
  // a second Sign-off button — the canonical sign-off action stays in the lifted strip (carry-fwd #B).
  const verb = (navOnly && s.status==="sign") ? "Review"
    : s.status==="merge" ? "View" : (s.status==="run"||s.status==="loop") ? "Open" : s.status==="unset" ? "Define done" : "Continue";
  const primary = `<button class="btn primary sm" data-open="${s.id}">${continueIcon()} ${verb}</button>`;
  let secondary="";
  if(s.status==="sign" && !navOnly) secondary=`<button class="btn sign sm" data-signoff="${s.id}">✓ Sign off</button>`;
  // (#it6-p7a) failAction PRODUCTION DERIVATION (heuristic, no new pi primitive): keyed off the failing
  // criterion / error from tool_execution_end — command-fail → "Re-run <cmd>", git conflicted → "Resolve
  // conflict", an auth/401/token keyword → "Re-authenticate", default "Re-run". It only LABELS the resume
  // button; it never gates anything and never asserts an alarm pi can't ground.
  else if(s.status==="fail") secondary=`<button class="btn ghost sm" data-open="${s.id}">${esc(s.failAction||"Re-run")}</button>`;
  // no Pause control — a durable pause/resume needs an orchestrator pi can't ground (carry-fwd #D)

  const dodTxt = s.status==="unset" ? `<span style="color:var(--st-sign)">no criterion set — define what done means</span> ${srcTag(s.dodSrc)}`
    : dodInline(s.dod, s.dodSrc);
  // de-noise (#6): when a row's DoD is IDENTICAL to its workstream's (same text + same source), the
  // workstream header already states it — so suppress the repeated per-row line. It re-appears only on
  // rows whose source/criteria DEVIATE (e.g. a sign-off or merged row inside a rule-based workstream).
  const dodHoisted = w && w.status!=="unset" && s.status!=="unset" && s.dod===w.dod && s.dodSrc===w.dodSrc;
  // live loop badge = elapsed only, derived from the stored loopStartedAt via loopMinutes() — the SAME
  // grounded source the hero uses, never the free-text meta string (round-3 adv-fix C1/C2). iter count /
  // rhythm / budget are PROPOSED (#D).
  const loopTag = s.loop ? `<span class="loopBadge"><span class="inf">∞</span> looping ${esc(fmtMin(loopMinutes(s,w)))}</span>` : "";
  // (#it6-p7b) a NON-elicited idle stop can't be PROVEN blocked — surface the honest "Idle · may be waiting"
  // degradation (grey, no alarm hue), never a fabricated amber block. This is the only place it renders on a row.
  const softTag = (s.status==="block" && !s.elicited) ? ` ${badge("block", true)}` : "";

  return `<div class="sess" data-open="${s.id}">
    ${dot}
    <div class="sess-main">
      <div class="sess-top"><span class="sess-name">${esc(s.name)}</span>${softTag} ${loopTag}</div>
      <div class="sess-live">${s.kind==='question'?'❔ ':''}${s.kind==='failed'?'⚠ ':''}<b>${esc(s.live)}</b>${(!s.loop&&s.meta&&s.kind!=='failed'&&s.status!=='block'&&s.status!=='unset')?` · ${esc(s.meta)}`:""}</div>
      ${dodHoisted?"":`<div class="sess-dod">${dodTxt}</div>`}
      ${artifact}
      ${queue}
      ${s.loop?proposedLoop(s):""}
    </div>
    <div class="sess-act" onclick="event.stopPropagation()">
      ${primary}
      ${secondary}
    </div>
  </div>`;
}

function iterSparkHtml(arr){
  const max=Math.max(...arr,1);
  return `<span class="iterspark" title="iteration rhythm — tool_execution_end events per loop iteration (health, not progress)">`+arr.map(v=>`<i style="height:${Math.max(3,Math.round(v/max*16))}px"></i>`).join("")+`</span>`;
}

/* ─────────────────────────── conversation overlay ─────────────────────────── */
function critListHtml(s){
  if(!s.crit || !s.crit.length) return "";
  // EVALUATOR family (#18) — distinct from the DoD's provenance pill (authoredBy, shown at the DoD level).
  // Every src resolves to one of the four REAL evaluators; an agent-asserted boolean is a manual evaluator.
  const evalFamily = {manual:"manual",command:"command",git_merged:"git",git_clean:"git",git_ahead_zero:"git",agent:"manual",session_idle:"runtime"};
  return `<div class="critlist">`+s.crit.map(c=>{
    const fam = evalFamily[c.src]||"manual";
    const stale=critStale(c), unrun=critUnrun(c);
    const root=rootScoped(c);  // git_clean → repo-root working tree, shared across co-located sessions
    const atTxt = unrun ? ` <span class="stale">· not yet run — excluded from %</span>`
      : (c.at ? ` <span class="${stale?'stale':''}">· evaluated ${esc(c.at)}${stale?' (stale)':''}</span>` : "");
    const ev = (c.ev||unrun||c.src==="command") ? `<div class="cev">${esc(c.ev||"")}${atTxt}${c.src==="command"?` <button class="recheck" data-recheck>${recheckIcon()} re-check</button>`:""}</div>` : "";
    // (round-2 adv-fix) render git_clean as a repo-root fact, NOT a per-session criterion: it is excluded
    // from this session's % and labelled as the shared working tree, so a clean tree is never credited to
    // one of several co-located sessions as if that session alone earned it.
    const scopePill = root ? `<span class="gatepill" title="working tree clean is a property of the shared repo root (gitStatus on the cwd), not this one session — co-located sessions share it. Shown once, at repo-root scope, and excluded from this session's %.">repo-root scope · excluded from %</span>` : "";
    return `<div class="crit ${c.met?'met':''} ${c.gate?'gate':''}">
      <span class="box">${c.met?'✓':(c.gate?'…':'')}</span>
      <div><div class="ctext">${esc(c.text)} <span class="srcTag" style="margin-left:4px" title="evaluator: ${esc(fam)}">${esc(fam)}</span>${c.gate?`<span class="gatepill">sign-off gate · excluded from %</span>`:""}${scopePill}</div>
      ${ev}</div>
    </div>`;
  }).join("")+`</div>`;
}

function transcript(s,w,p){
  const sys = `<div class="m sys">Session opened in <span class="mono">${esc(p.path)}</span></div>`;
  const userMsg = txt => `<div class="m user">${esc(txt)}</div>`;
  const ai = html => `<div class="m ai">${html}</div>`;
  const think = (title,body)=>`<div class="tcard think"><div class="tcard-h" data-tc><span class="ic">✦</span><span class="ti">${esc(title)}</span><span class="cv">${chevIcon()}</span></div><div class="tcard-b">${esc(body)}</div></div>`;
  const tool = (title,body,ok)=>`<div class="tcard ${ok?'ok':''}"><div class="tcard-h" data-tc><span class="ic">${ok?'✓':'›_'}</span><span class="ti">${esc(title)}</span><span class="cv">${chevIcon()}</span></div><div class="tcard-b">${esc(body)}</div></div>`;

  let body = sys;
  if(s.status==="block"){
    body += userMsg("Set this up for me.");
    const askBlock = s.elicited
      ? `<p>Groundwork is wired. Before I continue toward the Definition of Done, I need a decision from you (structured ask_user prompt — options below pre-fill your reply):</p><div class="q"><b>${esc(s.live)}</b></div>`
      : `<p>Groundwork is wired, then I stopped with a free-text question. There are no structured options to offer as chips — read it and reply in your own words:</p><div class="q"><b>${esc(s.live)}</b></div>`;
    body += ai(think("Thought for 8s · planning","Need a product decision before I lock in the work, since it changes the test fixtures and is hard to reverse later.")
      + tool("bash · probe","$ … returned ok", true) + askBlock);
  } else if(s.status==="fail"){
    body += userMsg("Keep this in sync for me.");
    body += ai(tool("cron · run","$ node sync.js\n→ refreshing token\n✗ 401 invalid_grant: token expired or revoked", false)
      + `<div class="ferr"><b>⚠ Failed — ${esc(s.live)}</b><br>I can resume the moment you ${esc((s.failAction||'re-run').toLowerCase())}. Nothing else is blocked on this.</div>`);
  } else if(s.status==="loop"){
    body += `<div class="m sys">Autonomous loop · looping ${esc(fmtMin(loopMinutes(s,w)))} · DoD: ${esc(s.dod)}</div>`;
    body += ai(think("Thought · picking the next item","Open-ended loop. I work the highest-signal item, re-evaluate, and append new findings. Stopping condition is the DoD, not a fixed list.")
      + tool("run · latest iteration","… progress this iteration", false)
      + `<p>${esc(s.live)} I will keep looping until the Definition of Done is met.</p>`);
    if(s.queue){
      const total=s.queueTotal||s.queue.length; const shown=s.queue.slice(0,3); const more=total-shown.length;
      body += `<div class="m ai"><div class="tcard open"><div class="tcard-h" data-tc><span class="ic">≡</span><span class="ti">Planned next (~${total} queued, growing · best-effort)</span><span class="cv">${chevIcon()}</span></div><div class="tcard-b">`+shown.map(q=>`· ${esc(q)}`).join("\n")+(more>0?`\n… ~${more} more — growth is expected for an open-ended loop`:"")+`</div></div></div>`;
    }
  } else if(s.status==="run"){
    body += userMsg("Work on this for me.");
    body += ai(tool("tool · step","→ in progress", true)
      + `<p>${esc(s.live)} I will leave results for your review and never finalize without sign-off.</p>`);
  } else if(s.status==="unset"){
    body += `<div class="m sys">No Definition of Done set for this session.</div>`;
    body += ai(`<p>I do not have a Definition of Done for <b>${esc(s.name)}</b> yet, so I will not show a fabricated percent. Tell me what "done" means here and I will track progress against it.</p>`
      + `<div class="q" style="border-color:color-mix(in srgb,var(--st-sign) 42%,var(--border));background:color-mix(in srgb,var(--st-sign) 9%,transparent);color:#eaddff"><b>What is the Definition of Done?</b><br>e.g. "a decision doc comparing 3 options, reviewed by me" — or pick a git / test rule.</div>`);
  } else if(s.status==="sign" || s.status==="merge"){
    const merged = s.status==="merge";
    body += userMsg(`Build ${esc(s.name)}.`);
    body += ai(think("Thought · wrapping up","Implementation is complete and the Definition of Done is satisfied. Surfacing the verification artifact so you can confirm at a glance.")
      + `<p>${esc(s.live)} ${merged?'It is merged into local main and the check passed.':'Every evaluable criterion is green (100%); only your sign-off gate remains.'}</p>`
      + artifactPreview(s));
  } else {
    body += `<div class="m sys">DoD: ${esc(s.dod)} · ${esc(s.dodSrc)}</div>`;
    if(s.queue && s.queue.length){
      body += ai(`<p>${esc(s.live)} Here is the plan I will run once you say go (best-effort, parsed from my notes):</p>`
        + `<div class="tcard open"><div class="tcard-h" data-tc><span class="ic">≡</span><span class="ti">Plan</span><span class="cv">${chevIcon()}</span></div><div class="tcard-b">`+s.queue.map(q=>`· ${esc(q)}`).join("\n")+`</div></div>`);
    } else { body += ai(`<p>${esc(s.live)}</p>`); }
  }
  return body;
}

/* (#it6-p7c) a check is either a COMMAND (real exit code) or a MANUAL/visual review (no exit code exists).
   A manual check rendered as "exit 0" fakes a command result — so a manual check ({kind:'manual'} or a
   visual/manual/review cmd) shows "reviewed", and only a real command shows "exit N". */
function isManualCheck(ch){ return !!ch && (ch.kind==="manual" || /visual|manual|review/i.test(ch.cmd||"")); }
function checkChip(ch){
  if(!ch) return "";
  return isManualCheck(ch)
    ? `<span class="ok">✓ ${esc(ch.cmd)} · reviewed</span>`
    : `<span class="ok">✓ ${esc(ch.cmd)} ${ch.exit===0?'exit 0':'exit '+ch.exit} · ${esc(ch.at||'')}</span>`;
}
function artifactPreview(s){
  // (#it5-p7b) MOCK-ONLY rendering: the diff-hunk lines below and the doc-markdown body are hardcoded
  // fixture content for the mockup. In production: the diff comes from GET /api/git/commit (numstat +
  // patch, spec §4.1) and the doc body from the session's write/edit tool_result entries — never synthesized.
  const a=s.artifact; if(!a) return "";
  if(a.kind==="doc"){
    return `<div class="art"><div class="art-h"><span class="at">${esc(a.note)}</span><span style="color:var(--muted)">${a.files} file${a.files>1?"s":""} · no repo</span><span class="ok">✓ user-reviewed</span></div>
      <div class="art-b"><div class="md">
        <h4>Competitor pricing — summary</h4>
        <ul><li><b>Plaid</b> — usage-based, $0.30 / linked item / mo</li><li><b>Finicity</b> — tiered, volume discounts &gt; 50k</li><li><b>MX</b> — flat platform fee + per-call</li></ul>
        <div style="margin-top:8px;color:var(--muted);font-size:11px">Plain folder · verification is your review of the rendered notes, not a merge.</div>
      </div></div></div>`;
  }
  if(a.kind==="spark"){
    return `<div class="art"><div class="art-h"><span class="at">${esc(a.note||'chart')}</span><span style="color:var(--muted)">${esc(a.branch)} · +${a.add}/−${a.del}</span>${a.check?checkChip(a.check):`<span class="ok">✓ visual · reviewed</span>`}</div>
      <div class="art-b">
        <!-- (#it5-p7h) artifact preview chart in a NEUTRAL stroke, not status-cyan: it is the rendered
             output of the work, not a live STATUS signal, so it must not borrow the running hue (#2). -->
        <svg class="spark" viewBox="0 0 320 96" preserveAspectRatio="none">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--muted)" stop-opacity=".28"/><stop offset="1" stop-color="var(--muted)" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 70 L40 64 L80 58 L120 48 L160 52 L200 38 L240 30 L280 22 L320 14 L320 96 L0 96 Z" fill="url(#sg)"/>
          <path d="M0 70 L40 64 L80 58 L120 48 L160 52 L200 38 L240 30 L280 22 L320 14" fill="none" stroke="var(--muted)" stroke-width="2"/>
        </svg>
        <div style="margin-top:8px;color:var(--muted);font-size:12px">Net worth, last 12 months — D3 replaced with an inline sparkline (38kb → 1.2kb).</div>
      </div></div>`;
  }
  const merged=a.merged;
  const manualCk = isManualCheck(a.check);
  return `<div class="art"><div class="art-h"><span class="at">${merged?`merged · ${esc(a.sha)}`:esc(a.branch)}</span> <span style="color:var(--muted)">+${a.add}/−${a.del}${a.ahead?` · ahead ${a.ahead}`:""}</span>${checkChip(a.check)}</div>
    <div class="art-b"><div class="diff">
      <div class="ctx">@@ ${esc(s.name)} @@  ${merged?`(merge-base --is-ancestor: ✓)`:`(branch ${esc(a.branch)})`}</div>
      <div class="del">- legacy path with no verification</div>
      <div class="add">+ verified implementation · ${a.add} insertions</div>
      <div class="add">+ ${a.check?(manualCk?`${esc(a.check.cmd)} → reviewed`:`${esc(a.check.cmd)} → exit ${a.check.exit}`):'checks recorded'}</div>
    </div>
    <div style="margin-top:8px;color:var(--muted);font-size:11px">Grounded in <span class="mono">git numstat</span> (+${a.add}/−${a.del})${merged?` and <span class="mono">git merge-base --is-ancestor</span>`:` on <span class="mono">${esc(a.branch)}</span>`}${a.check?` · check via on-demand command DoD`:""}.</div>
    </div></div>`;
}

function openSession(id, prefill){
  const ref = state.SESS[id]; if(!ref) return;
  const {s,w,p}=ref;
  // composer secondary action — two-step sign-off then merge (#10), never a fused "Sign off & merge";
  // the merge step is gated on a real git branch and labelled unambiguously (#4)
  let secActions="";
  if(s.status==="sign") secActions=`<button class="btn sign sm" data-signoff="${s.id}">✓ Sign off</button><span class="lab">then</span>${mergeAffordance(s)}`;
  else if(s.status==="merge") secActions=`<span class="lab">Or:</span><button class="btn ghost sm">Open merge ${esc((s.artifact||{}).sha||'')}</button>`;
  else if(s.status==="fail") secActions=`<span class="lab">Or:</span><button class="btn ghost sm">${esc(s.failAction||'Re-run')}</button>`;
  // run/loop: no durable Pause control (carry-fwd #D) — steer the loop by continuing the conversation
  else if(s.status==="unset") secActions=`<span class="lab">Or:</span><button class="btn ghost sm">Pick a git / test rule</button>`;

  // quick-reply chips ONLY for structured elicitations (#12)
  let cqr="";
  if(s.elicited && s.chips && s.chips.length){
    cqr = `<div class="cqreply"><span class="qlbl">quick reply →</span>`+s.chips.map(q=>`<button data-cfill="${esc(q)}">${esc(q)}</button>`).join("")+`</div>`;
  }

  const placeholder = s.status==="block"
    ? "Ask pi…  (your reply continues the conversation)"
    : s.status==="unset" ? "Ask pi…  (describe what done means, or name a git/test rule)"
    : "Ask pi…  (pick up the conversation where it left off)";

  let focusBar="";
  if(state.focus){
    const {ids,i}=state.focus; const left=ids.length-i-1;
    focusBar = `<div class="focusbar show">${focusIcon()} Focus triage · item ${i+1} of ${ids.length}<span class="grow"></span>${left>0?`<button class="btn ghost sm" id="focusNext">Next (${left} left) ${chevIcon()}</button>`:`<button class="btn ghost sm" id="focusDone">Done</button>`}</div>`;
  }

  const ringItem = (s._prog || s.status!=='queued') ? s : w;
  const conv = document.getElementById("conv");
  conv.innerHTML = `
    ${focusBar}
    <div class="conv-head">
      <div class="conv-crumb">
        <div class="cc1"><b>${esc(p.name)}</b> &nbsp;›&nbsp; ${esc(w.name)} ${p.nest?`· ${esc(p.nest)}`:""}</div>
        <div class="cc2">${esc(s.name)} ${badge(s.status, s.status==="block"&&!s.elicited)}</div>
      </div>
      <button class="conv-close" id="convClose">${xIcon()}</button>
    </div>
    <div class="dodbar" id="dodbar">
      <div class="dodbar-top" data-dod>
        <div class="dring">${ringSvg(ringItem, 38)}</div>
        <div class="dtxt">
          <div class="dt1">Definition of Done ${srcTag(s.dodSrc)}</div>
          <div class="dt2">${s.status==="unset"?'<span style="color:var(--st-sign)">not set — define what done means below</span>':esc(s.dod)}${(s.status==="sign"&&s._gate)?' <span style="color:var(--st-sign)">· 100% of evaluable criteria met, sign-off gate pending</span>':''}</div>
        </div>
        ${s.crit&&s.crit.length?`<span class="dexp chev">${chevIcon()}</span>`:""}
      </div>
      ${critListHtml(s)}
    </div>
    <div class="conv-msgs" id="convMsgs">${transcript(s,w,p)}</div>
    <div class="composer">
      ${cqr}
      <div class="secrow">${secActions}</div>
      <div class="ctextwrap">
        <textarea class="ctext" id="ctext" placeholder="${esc(placeholder)}"></textarea>
        <div class="cfoot">
          <span class="cmodel">pi-opus · <span class="think">thinking: high</span></span>
          <span class="grow"></span>
          <button class="csend" id="csend">${sendIcon()} Send</button>
        </div>
      </div>
      <div class="hint">Continue the conversation — your reply goes straight to the agent. Approve / sign-off are optional shortcuts above.</div>
    </div>`;

  document.getElementById("cback").classList.add("show");
  conv.classList.add("show"); conv.setAttribute("aria-hidden","false");
  const msgs=document.getElementById("convMsgs");
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });
  const ta=document.getElementById("ctext");
  if(prefill){ ta.value=prefill; }
  setTimeout(()=>{ if(s.status==="block"||s.status==="fail"||s.status==="unset"||prefill) ta.focus(); }, 260);

  document.getElementById("convClose").onclick = ()=>{ state.focus=null; closeConv(); };
  const dodTop=conv.querySelector("[data-dod]");
  if(dodTop) dodTop.onclick=()=>document.getElementById("dodbar").classList.toggle("open");
  conv.querySelectorAll("[data-cfill]").forEach(b=> b.onclick=()=>{ ta.value=b.getAttribute("data-cfill"); ta.focus(); });
  conv.querySelectorAll("[data-recheck]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); b.innerHTML=`${recheckIcon()} re-running…`; });
  const fn=document.getElementById("focusNext"); if(fn) fn.onclick=()=>{ state.focus.i++; openSession(state.focus.ids[state.focus.i]); };
  const fd=document.getElementById("focusDone"); if(fd) fd.onclick=()=>{ state.focus=null; closeConv(); };

  document.getElementById("csend").onclick = ()=>{
    const v=ta.value.trim(); if(!v) { ta.focus(); return; }
    const fresh=document.getElementById("convMsgs");
    fresh.insertAdjacentHTML("beforeend", `<div class="m user">${esc(v)}</div>`+
      `<div class="m ai"><div class="tcard think open"><div class="tcard-h" data-tc><span class="ic">✦</span><span class="ti">pi is thinking…</span><span class="cv">${chevIcon()}</span></div><div class="tcard-b">Picking up the conversation with your reply and resuming work toward the Definition of Done.</div></div></div>`);
    ta.value=""; fresh.scrollTop=fresh.scrollHeight;
    fresh.querySelectorAll("[data-tc]").forEach(h=> h.onclick=()=> h.parentElement.classList.toggle("open"));
  };
  conv.querySelectorAll("[data-tc]").forEach(h=> h.onclick=()=> h.parentElement.classList.toggle("open"));
}
function closeConv(){
  document.getElementById("cback").classList.remove("show");
  const conv=document.getElementById("conv"); conv.classList.remove("show"); conv.setAttribute("aria-hidden","true");
}

/* ─────────────────────────── events ─────────────────────────── */
document.addEventListener("click", e=>{
  const reply = e.target.closest("[data-reply]");
  if(reply){ e.preventDefault(); e.stopPropagation(); openSession(reply.getAttribute("data-reply"), reply.getAttribute("data-text")); return; }

  const rc = e.target.closest("[data-recheckcard]");
  if(rc){ e.preventDefault(); e.stopPropagation(); recheckCard(rc.getAttribute("data-recheckcard")); return; }

  const so = e.target.closest("[data-signoff]");
  if(so){ e.preventDefault(); e.stopPropagation(); signOff(so.getAttribute("data-signoff")); return; }

  if(e.target.closest("#signAll")){ e.preventDefault(); e.stopPropagation(); signOffAll(); return; }

  const open = e.target.closest("[data-open]");
  if(open){ e.preventDefault(); e.stopPropagation(); openSession(open.getAttribute("data-open")); return; }

  // jump-links land ON the matching surface AND auto-expand collapsed targets (#10)
  const jump = e.target.closest("[data-jump]");
  if(jump){ e.preventDefault(); e.stopPropagation(); const el=document.getElementById(jump.getAttribute("data-jump"));
    if(el){
      const grp=el.closest(".grpcard"); if(grp) grp.classList.add("open");
      if(el.classList.contains("grpcard")||el.classList.contains("done")||el.classList.contains("pcard")) el.classList.add("open");
      if(el.classList.contains("prow")){ el.classList.add("open"); const body=el.nextElementSibling; if(body&&body.classList.contains("prow-body")) body.classList.add("open"); }
      el.scrollIntoView({behavior:"smooth",block:"start"});
    } return; }

  if(e.target.closest("#focusBtn")){
    const items=[]; Object.values(state.SESS).forEach(({s})=>{ if(isNeed(s)) items.push(s); });
    items.sort((a,b)=> blastRank(blastRadius(a))-blastRank(blastRadius(b)) || (a.status==="block"?0:1)-(b.status==="block"?0:1));
    state.focus={ids:items.map(s=>s.id), i:0}; openSession(state.focus.ids[0]); return;
  }

  // generic "show all" reveal — works for Done/Planned groups AND the dormant/needs lists (#9)
  const more = e.target.closest("[data-toggle=more]");
  if(more){ e.stopPropagation(); const mr=more.previousElementSibling; if(mr&&mr.classList.contains("more-rows")) mr.hidden=false; more.remove(); return; }

  const tg = e.target.closest("[data-toggle]");
  if(tg){
    const kind=tg.getAttribute("data-toggle");
    if(kind==="card") tg.closest(".pcard").classList.toggle("open");
    else if(kind==="ws") tg.closest(".ws").classList.toggle("open");
    else if(kind==="sessmore"){ const ex=tg.previousElementSibling; if(ex&&ex.classList.contains("sess-extra")) ex.hidden=false; tg.remove(); }
    else if(kind==="done") tg.closest(".done").classList.toggle("open");
    else if(kind==="grp") tg.closest(".grpcard").classList.toggle("open");
    else if(kind==="needmore") tg.closest(".needmore").classList.toggle("open");
    else if(kind==="prow"){ tg.classList.toggle("open"); const id=tg.getAttribute("data-rowp"); const body=document.querySelector(`[data-rowbody="${id}"]`); if(body) body.classList.toggle("open"); }
    return;
  }
});
document.getElementById("cback").addEventListener("click", ()=>{ state.focus=null; closeConv(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ state.focus=null; closeConv(); } });

/* scenario switcher */
const sel=document.getElementById("scnSel");
sel.innerHTML = Object.entries(SCENARIOS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join("");
sel.addEventListener("change", ()=>{ const v=sel.value; history.replaceState(null,"","?scn="+v); loadScenario(v); });

/* boot */
const qs = new URLSearchParams(location.search).get("scn");
const boot = (qs && SCENARIOS[qs]) ? qs : "default";
sel.value = boot;
loadScenario(boot);
</script>
